<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanbulo Bakery Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8f0;
      color: #3b2416;
    }

    header {
      background: #6b3f25;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 6px 0 0;
      opacity: .9;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #d9772a;
      color: white;
      width: 100%;
    }

    .logout {
      background: #fff;
      color: #6b3f25;
      margin-top: 12px;
    }

    .product {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .product img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .product-info {
      flex: 1;
    }

    .product-info h3 {
      margin: 0 0 5px;
    }

    .price {
      font-weight: bold;
      color: #d9772a;
    }

    .buttons {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .edit {
      background: #eee;
    }

    .delete {
      background: #d9534f;
      color: white;
    }

    .available {
      background: #198754;
      color: white;
    }

    .unavailable {
      background: #777;
      color: white;
    }

    #dashboard {
      display: none;
    }

    #loginMessage,
    #message {
      margin-top: 10px;
      font-weight: bold;
    }

    .preview {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      display: none;
      margin-bottom: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🥖 Kanbulo Bakery</h1>
  <p>Admin Dashboard</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="box">
    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button class="primary" onclick="login()">
      Login
    </button>

    <div id="loginMessage"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard">

    <div class="box">
      <h2 id="formTitle">➕ Add Product</h2>

      <input type="hidden" id="editId">

      <label>Product name</label>
      <input
        type="text"
        id="name"
        placeholder="Example: Chicken Sandwich"
      >

      <label>Price (MVR)</label>
      <input
        type="number"
        id="price"
        placeholder="Example: 35"
        min="0"
        step="0.01"
      >

      <label>Category</label>
      <select id="category">
        <option value="Bakery">Bakery</option>
        <option value="Cakes">Cakes</option>
        <option value="Sweets">Sweets</option>
        <option value="Other">Other</option>
      </select>

      <label>Description</label>
      <textarea
        id="description"
        placeholder="Short description"
      ></textarea>

      <label>Product picture</label>
      <input
        type="file"
        id="image"
        accept="image/*"
        onchange="previewImage()"
      >

      <img id="preview" class="preview">

      <button class="primary" onclick="saveProduct()">
        💾 Save Product
      </button>

      <button
        id="cancelButton"
        class="logout hidden"
        onclick="cancelEdit()"
      >
        Cancel Edit
      </button>

      <div id="message"></div>
    </div>


    <div class="box">
      <h2>📦 Your Products</h2>
      <div id="products">Loading...</div>
    </div>


    <div class="box">
      <button class="logout" onclick="logout()">
        🚪 Logout
      </button>
    </div>

  </div>
</div>


<script>

  // ==========================================
  // SUPABASE SETTINGS
  // ==========================================

  const SUPABASE_URL =
    "https://kyrkcfytfptlwzyemwlw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dYpkOE1xtLwYnITLYKgXTg_K6Bb0fF6";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


  // ==========================================
  // CHECK LOGIN
  // ==========================================

  checkUser();

  async function checkUser() {

    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
      showDashboard();
    } else {
      showLogin();
    }
  }


  // ==========================================
  // LOGIN
  // ==========================================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    if (!email || !password) {
      message.textContent =
        "Please enter your email and password.";
      return;
    }

    message.textContent = "Logging in...";

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      message.textContent =
        "❌ " + error.message;

      return;
    }

    message.textContent = "";

    showDashboard();
  }


  // ==========================================
  // LOGOUT
  // ==========================================

  async function logout() {

    await supabaseClient.auth.signOut();

    showLogin();
  }


  // ==========================================
  // SHOW / HIDE
  // ==========================================

  function showDashboard() {

    document.getElementById("loginBox")
      .style.display = "none";

    document.getElementById("dashboard")
      .style.display = "block";

    loadProducts();
  }


  function showLogin() {

    document.getElementById("loginBox")
      .style.display = "block";

    document.getElementById("dashboard")
      .style.display = "none";
  }


  // ==========================================
  // IMAGE PREVIEW
  // ==========================================

  function previewImage() {

    const file =
      document.getElementById("image").files[0];

    const preview =
      document.getElementById("preview");

    if (!file) {

      preview.style.display = "none";
      return;
    }

    preview.src =
      URL.createObjectURL(file);

    preview.style.display = "block";
  }


  // ==========================================
  // UPLOAD IMAGE
  // ==========================================

  async function uploadImage(file) {

    if (!file) return null;

    const extension =
      file.name.split(".").pop();

    const filename =
      Date.now() + "-" +
      Math.random().toString(36).substring(2) +
      "." + extension;

    const path =
      filename;

    const { error } =
      await supabaseClient.storage
        .from("Product-images")
        .upload(path, file);

    if (error) {
      throw error;
    }

    const { data } =
      supabaseClient.storage
        .from("product-images")
        .getPublicUrl(path);

    return data.publicUrl;
  }


  // ==========================================
  // SAVE PRODUCT
  // ==========================================

  async function saveProduct() {

    const message =
      document.getElementById("message");

    const id =
      document.getElementById("editId").value;

    const name =
      document.getElementById("name").value.trim();

    const price =
      document.getElementById("price").value;

    const category =
      document.getElementById("category").value;

    const description =
      document.getElementById("description").value.trim();

    const imageFile =
      document.getElementById("image").files[0];


    if (!name || price === "") {

      message.textContent =
        "Please enter a product name and price.";

      return;
    }


    message.textContent =
      "Saving...";


    try {

      let imageUrl = null;


      // Upload new image if selected
      if (imageFile) {

        message.textContent =
          "Uploading picture...";

        imageUrl =
          await uploadImage(imageFile);
      }


      const productData = {

        name: name,

        price: Number(price),

        category: category,

        description: description,

        available: true
      };


      // ADD
      if (!id) {

        if (imageUrl) {
          productData.image_url = imageUrl;
        }

        const { error } =
          await supabaseClient
            .from("products")
            .insert(productData);

        if (error) throw error;

        message.textContent =
          "✅ Product added!";
      }


      // EDIT
      else {

        if (imageUrl) {
          productData.image_url = imageUrl;
        }

        const { error } =
          await supabaseClient
            .from("products")
            .update(productData)
            .eq("id", id);

        if (error) throw error;

        message.textContent =
          "✅ Product updated!";
      }


      clearForm();

      loadProducts();

    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ " + error.message;
    }
  }


  // ==========================================
  // LOAD PRODUCTS
  // ==========================================

  async function loadProducts() {

    const container =
      document.getElementById("products");

    container.innerHTML =
      "Loading...";


    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("id", { ascending: false });


    if (error) {

      container.innerHTML =
        "❌ " + error.message;

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        "No products yet.";

      return;
    }


    container.innerHTML = "";


    data.forEach(product => {

      const div =
        document.createElement("div");

      div.className =
        "product";


      const image =
        Product.image_url ||
        "https://via.placeholder.com/100?text=🥖";


      div.innerHTML = `

        <img src="${image}" alt="">

        <div class="product-info">

          <h3>
            ${escapeHtml(product.name)}
          </h3>

          <div class="price">
            MVR ${Number(product.price).toFixed(2)}
          </div>

          <small>
            ${escapeHtml(product.category || "")}
          </small>

          <div class="buttons">

            <button
              class="edit"
              onclick="editProduct(${product.id})">
              ✏️ Edit
            </button>

            <button
              class="${product.available ? "available" : "unavailable"}"
              onclick="toggleAvailability(
                ${product.id},
                ${product.available}
              )">
              ${product.available
                ? "✅ Available"
                : "❌ Unavailable"}
            </button>

            <button
              class="delete"
              onclick="deleteProduct(${product.id})">
              🗑️ Delete
            </button>

          </div>

        </div>
      `;


      container.appendChild(div);

    });
  }


  // ==========================================
  // EDIT PRODUCT
  // ==========================================

  async function editProduct(id) {

    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

      alert(error.message);
      return;
    }


    document.getElementById("editId")
      .value = data.id;

    document.getElementById("name")
      .value = data.name;

    document.getElementById("price")
      .value = data.price;

    document.getElementById("category")
      .value = data.category || "Bakery";

    document.getElementById("description")
      .value = data.description || "";


    document.getElementById("formTitle")
      .textContent = "✏️ Edit Product";


    document.getElementById("cancelButton")
      .classList.remove("hidden");


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  // ==========================================
  // CANCEL EDIT
  // ==========================================

  function cancelEdit() {

    clearForm();
  }


  function clearForm() {

    document.getElementById("editId")
      .value = "";

    document.getElementById("name")
      .value = "";

    document.getElementById("price")
      .value = "";

    document.getElementById("description")
      .value = "";

    document.getElementById("image")
      .value = "";

    document.getElementById("preview")
      .style.display = "none";

    document.getElementById("formTitle")
      .textContent = "➕ Add Product";

    document.getElementById("cancelButton")
      .classList.add("hidden");
  }


  // ==========================================
  // AVAILABILITY
  // ==========================================

  async function toggleAvailability(id, current) {

    const { error } =
      await supabaseClient
        .from("products")
        .update({
          available: !current
        })
        .eq("id", id);


    if (error) {

      alert(error.message);
      return;
    }


    loadProducts();
  }


  // ==========================================
  // DELETE
  // ==========================================

  async function deleteProduct(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this product?"
      );


    if (!confirmed) return;


    const { error } =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (error) {

      alert(error.message);
      return;
    }


    loadProducts();
  }


  // ==========================================
  // SECURITY HELPER
  // ==========================================

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

</script>

</body>
</html>
