<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanbulo Bakery - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7efe7;
      color: #3d2418;
    }

    header {
      background: #6b351c;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #6b351c;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin: 7px 0 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      font-size: 14px;
      cursor: pointer;
    }

    .primary {
      background: #8b451f;
      color: white;
    }

    .secondary {
      background: #eee;
      color: #333;
    }

    .danger {
      background: #c0392b;
      color: white;
    }

    .success {
      background: #27834b;
      color: white;
    }

    .logout {
      background: #333;
      color: white;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 15px;
      background: #fff3cd;
    }

    .product {
      display: flex;
      gap: 14px;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 14px 0;
    }

    .product:last-child {
      border-bottom: none;
    }

    .product img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-name {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 4px;
    }

    .product-price {
      color: #8b451f;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .product-category {
      font-size: 13px;
      color: #777;
    }

    .available {
      color: #27834b;
      font-size: 13px;
      font-weight: bold;
    }

    .unavailable {
      color: #c0392b;
      font-size: 13px;
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .preview {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      display: none;
      margin-bottom: 12px;
    }

    .login-box {
      max-width: 430px;
      margin: 50px auto;
    }

    .small {
      font-size: 13px;
      color: #777;
    }

    @media (max-width: 600px) {
      .product {
        align-items: flex-start;
      }

      .product img {
        width: 65px;
        height: 65px;
      }

      .actions {
        margin-top: 8px;
      }

      .actions button {
        padding: 9px 11px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🥖 Kanbulo Bakery</h1>
  <p>Admin Dashboard</p>
</header>

<!-- LOGIN -->
<div id="loginSection" class="container">
  <div class="card login-box">
    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button class="primary" onclick="login()">
      Login
    </button>

    <div id="loginMessage" class="message hidden"></div>
  </div>
</div>


<!-- ADMIN -->
<div id="adminSection" class="container hidden">

  <div class="card">
    <h2>➕ Add / Edit Product</h2>

    <input type="hidden" id="productId">

    <label>Product Name</label>
    <input
      type="text"
      id="productName"
      placeholder="Example: Chocolate Cake"
    >

    <label>Description</label>
    <textarea
      id="productDescription"
      placeholder="Product description"
    ></textarea>

    <label>Price (MVR)</label>
    <input
      type="number"
      id="productPrice"
      placeholder="Example: 50"
      step="0.01"
      min="0"
    >

    <label>Category</label>
    <select id="productCategory">
      <option value="Bakery">Bakery</option>
      <option value="Cakes">Cakes</option>
      <option value="Sweets">Sweets</option>
      <option value="Other">Other</option>
    </select>

    <label>Product Picture</label>
    <input
      type="file"
      id="productImage"
      accept="image/*"
      onchange="previewImage(event)"
    >

    <img id="imagePreview" class="preview">

    <label>
      <input
        type="checkbox"
        id="productAvailable"
        checked
        style="width:auto;margin-right:6px;"
      >
      Available
    </label>

    <br><br>

    <button class="primary" onclick="saveProduct()">
      💾 Save Product
    </button>

    <button
      class="secondary"
      onclick="clearForm()"
    >
      Clear
    </button>

    <div id="productMessage" class="message hidden"></div>
  </div>


  <div class="card">
    <h2>🍰 Products</h2>

    <input
      type="text"
      id="search"
      placeholder="🔎 Search products..."
      oninput="displayProducts()"
    >

    <div id="productsList">
      Loading products...
    </div>
  </div>


  <div class="card">
    <button
      class="logout"
      onclick="logout()"
    >
      🚪 Logout
    </button>
  </div>

</div>


<script>

  /* =========================
     SUPABASE SETTINGS
  ========================= */

  const SUPABASE_URL =
    "https://kyrkcfytfptlwzyemwlw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dYpkOE1xtLwYnITLYKgXTg_K6Bb0fF6";

  /*
    IMPORTANT:
    This must be your Supabase PUBLISHABLE key.
    Do NOT use a secret/service-role key here.
  */

  const STORAGE_BUCKET = "Product-images";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     VARIABLES
  ========================= */

  let products = [];
  let editingProductId = null;


  /* =========================
     LOGIN
  ========================= */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    if (!email || !password) {
      showMessage(
        message,
        "Please enter your email and password."
      );
      return;
    }

    showMessage(
      message,
      "Logging in..."
    );

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      showMessage(
        message,
        "❌ " + error.message
      );

      return;
    }

    message.classList.add("hidden");

    showAdmin();

    loadProducts();
  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("adminSection")
      .classList.add("hidden");

    document
      .getElementById("loginSection")
      .classList.remove("hidden");
  }


  /* =========================
     CHECK LOGIN
  ========================= */

  async function checkLogin() {

    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();

    if (session) {

      showAdmin();

      loadProducts();

    } else {

      document
        .getElementById("loginSection")
        .classList.remove("hidden");

    }
  }


  function showAdmin() {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("adminSection")
      .classList.remove("hidden");
  }


  /* =========================
     LOAD PRODUCTS
  ========================= */

  async function loadProducts() {

    const list =
      document.getElementById("productsList");

    list.innerHTML =
      "Loading products...";

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      list.innerHTML =
        "❌ Error loading products: " +
        escapeHtml(error.message);

      return;
    }

    products = data || [];

    displayProducts();
  }


  /* =========================
     DISPLAY PRODUCTS
  ========================= */

  function displayProducts() {

    const list =
      document.getElementById("productsList");

    const search =
      document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const filtered =
      products.filter(product =>
        (product.name || "")
          .toLowerCase()
          .includes(search)
      );

    if (!filtered.length) {

      list.innerHTML =
        "<p>No products found.</p>";

      return;
    }

    list.innerHTML =
      filtered.map(product => {

        const image =
          product.image_url ||
          "https://via.placeholder.com/100?text=🥖";

        const availability =
          product.available
            ? `<span class="available">● Available</span>`
            : `<span class="unavailable">● Unavailable</span>`;

        return `
          <div class="product">

            <img
              src="${escapeAttribute(image)}"
              alt="${escapeAttribute(product.name || "Product")}"
              onerror="this.src='https://via.placeholder.com/100?text=🥖'"
            >

            <div class="product-info">

              <div class="product-name">
                ${escapeHtml(product.name || "")}
              </div>

              <div class="product-price">
                MVR ${Number(product.price || 0).toFixed(2)}
              </div>

              <div class="product-category">
                ${escapeHtml(product.category || "Other")}
              </div>

              ${availability}

            </div>

            <div class="actions">

              <button
                class="secondary"
                onclick="editProduct(${product.id})"
              >
                ✏️ Edit
              </button>

              <button
                class="danger"
                onclick="deleteProduct(${product.id})"
              >
                🗑️ Delete
              </button>

            </div>

          </div>
        `;

      }).join("");
  }


  /* =========================
     IMAGE PREVIEW
  ========================= */

  function previewImage(event) {

    const file =
      event.target.files[0];

    const preview =
      document.getElementById("imagePreview");

    if (!file) {

      preview.style.display = "none";

      return;
    }

    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";
  }


  /* =========================
     UPLOAD IMAGE
  ========================= */

  async function uploadImage(file) {

    if (!file) return null;

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();

    const filename =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "." +
      extension;

    const path = filename;

    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(
          path,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );

    if (uploadError) {

      throw uploadError;
    }

    const {
      data
    } =
      supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(path);

    return data.publicUrl;
  }


  /* =========================
     SAVE PRODUCT
  ========================= */

  async function saveProduct() {

    const message =
      document.getElementById("productMessage");

    const name =
      document
        .getElementById("productName")
        .value
        .trim();

    const description =
      document
        .getElementById("productDescription")
        .value
        .trim();

    const price =
      parseFloat(
        document
          .getElementById("productPrice")
          .value
      ) || 0;

    const category =
      document
        .getElementById("productCategory")
        .value;

    const available =
      document
        .getElementById("productAvailable")
        .checked;

    const imageFile =
      document
        .getElementById("productImage")
        .files[0];


    if (!name) {

      showMessage(
        message,
        "Please enter a product name."
      );

      return;
    }


    showMessage(
      message,
      "Saving product..."
    );


    try {

      let imageUrl = null;


      /*
        If editing and no new image is selected,
        keep the existing image.
      */

      if (imageFile) {

        showMessage(
          message,
          "Uploading picture..."
        );

        imageUrl =
          await uploadImage(imageFile);

      } else if (editingProductId) {

        const existing =
          products.find(
            p =>
              Number(p.id) ===
              Number(editingProductId)
          );

        if (existing) {

          imageUrl =
            existing.image_url || null;
        }
      }


      const productData = {

        name: name,

        description:
          description || null,

        price: price,

        category:
          category || "Other",

        available:
          available,

        image_url:
          imageUrl

      };


      let error;


      if (editingProductId) {

        const result =
          await supabaseClient
            .from("products")
            .update(productData)
            .eq(
              "id",
              editingProductId
            );

        error =
          result.error;

      } else {

        const result =
          await supabaseClient
            .from("products")
            .insert([
              productData
            ]);

        error =
          result.error;
      }


      if (error) {

        throw error;
      }


      showMessage(
        message,
        editingProductId
          ? "✅ Product updated!"
          : "✅ Product added!"
      );


      clearForm();

      await loadProducts();


    } catch (error) {

      console.error(error);

      showMessage(
        message,
        "❌ " + error.message
      );
    }
  }


  /* =========================
     EDIT PRODUCT
  ========================= */

  function editProduct(id) {

    const product =
      products.find(
        p =>
          Number(p.id) ===
          Number(id)
      );

    if (!product) return;


    editingProductId =
      product.id;


    document
      .getElementById("productName")
      .value =
      product.name || "";


    document
      .getElementById("productDescription")
      .value =
      product.description || "";


    document
      .getElementById("productPrice")
      .value =
      product.price || 0;


    document
      .getElementById("productCategory")
      .value =
      product.category || "Other";


    document
      .getElementById("productAvailable")
      .checked =
      product.available !== false;


    const preview =
      document.getElementById("imagePreview");


    if (product.image_url) {

      preview.src =
        product.image_url;

      preview.style.display =
        "block";

    } else {

      preview.style.display =
        "none";
    }


    document
      .querySelector("#adminSection .card")
      .scrollIntoView({
        behavior: "smooth"
      });
  }


  /* =========================
     DELETE PRODUCT
  ========================= */

  async function deleteProduct(id) {

    const product =
      products.find(
        p =>
          Number(p.id) ===
          Number(id)
      );

    if (!product) return;


    const confirmed =
      confirm(
        `Delete "${product.name}"?`
      );

    if (!confirmed) return;


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "❌ " +
        error.message
      );

      return;
    }


    await loadProducts();
  }


  /* =========================
     CLEAR FORM
  ========================= */

  function clearForm() {

    editingProductId =
      null;


    document
      .getElementById("productId")
      .value = "";


    document
      .getElementById("productName")
      .value = "";


    document
      .getElementById("productDescription")
      .value = "";


    document
      .getElementById("productPrice")
      .value = "";


    document
      .getElementById("productCategory")
      .value =
      "Bakery";


    document
      .getElementById("productAvailable")
      .checked =
      true;


    document
      .getElementById("productImage")
      .value = "";


    const preview =
      document.getElementById("imagePreview");

    preview.src = "";

    preview.style.display =
      "none";
  }


  /* =========================
     MESSAGE
  ========================= */

  function showMessage(
    element,
    text
  ) {

    element.textContent =
      text;

    element.classList.remove(
      "hidden"
    );
  }


  /* =========================
     SECURITY HELPERS
  ========================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeAttribute(value) {

    return escapeHtml(value);
  }


  /* =========================
     START
  ========================= */

  checkLogin();

</script>

</body>
</html>
