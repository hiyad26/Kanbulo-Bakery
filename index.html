<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b4513">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kanbulo Bakery</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8f2;
      color: #333;
    }

    header {
      background: #8b4513;
      color: white;
      padding: 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    header p {
      margin: 0 0 12px;
    }

    .header-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
    }

    .cart-top-btn {
      background: white;
      color: #8b4513;
      font-weight: bold;
    }

    .login-btn {
      background: #5c2e0b;
      color: white;
    }

    .logout-btn {
      background: #333;
      color: white;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .search-box {
      margin-bottom: 20px;
    }

    #search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .category-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .category-buttons button {
      background: #eee;
      color: #333;
    }

    .category-buttons button.active {
      background: #8b4513;
      color: white;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      padding-bottom: 15px;
    }

    .product-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 15px;
    }

    .product-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .product-category {
      color: #777;
      margin-bottom: 7px;
    }

    .product-price {
      color: #8b4513;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .available {
      color: green;
      font-weight: bold;
    }

    .unavailable {
      color: red;
      font-weight: bold;
    }

    .card-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 0 15px;
    }

    .add-cart-btn {
      width: calc(100% - 30px);
      margin: 5px 15px 0;
      background: #8b4513;
      color: white;
      font-weight: bold;
    }

    .edit-btn {
      background: #3498db;
      color: white;
    }

    .hide-btn {
      background: #f39c12;
      color: white;
    }

    .delete-btn {
      background: #e74c3c;
      color: white;
    }

    #adminPanel {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 25px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    #adminPanel h2 {
      margin-top: 0;
      color: #8b4513;
    }

    #adminPanel input,
    #adminPanel select,
    #adminPanel textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    #adminPanel textarea {
      min-height: 90px;
      resize: vertical;
    }

    .admin-save-btn {
      background: #8b4513;
      color: white;
      font-weight: bold;
    }

    .admin-cancel-btn {
      background: #777;
      color: white;
    }

    .cart-section {
      background: white;
      margin-top: 35px;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    .cart-section h2 {
      color: #8b4513;
      margin-top: 0;
    }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-name {
      font-size: 18px;
      font-weight: bold;
    }

    .cart-item-price {
      color: #777;
      margin: 5px 0;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .quantity-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      background: #8b4513;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    .quantity-number {
      min-width: 35px;
      text-align: center;
      font-weight: bold;
    }

    .remove-btn {
      background: #e74c3c;
      color: white;
    }

    .cart-subtotal {
      margin-top: 7px;
      font-weight: bold;
    }

    .cart-total {
      border-top: 2px solid #8b4513;
      margin-top: 15px;
      padding-top: 15px;
      font-size: 22px;
      font-weight: bold;
      text-align: right;
      color: #8b4513;
    }

    .whatsapp-btn {
      width: 100%;
      background: #25d366;
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      padding: 14px;
    }

    .empty-cart {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .login-message {
      text-align: center;
      background: #fff3cd;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .status-message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      main {
        padding: 12px;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-image {
        height: 150px;
      }

      .product-info {
        padding: 10px;
      }

      .product-name {
        font-size: 17px;
      }

      .product-price {
        font-size: 16px;
      }

      .card-buttons {
        padding: 0 10px;
      }

      .add-cart-btn {
        width: calc(100% - 20px);
        margin-left: 10px;
        margin-right: 10px;
      }

      .card-buttons button {
        font-size: 12px;
        padding: 8px;
      }
    }
  </style>

</head>

<body>

<header>

  <h1>🥖 Kanbulo Bakery</h1>

  <p>Fresh & Delicious Every Day</p>

  <div class="header-buttons">

    <button
      class="cart-top-btn"
      onclick="scrollToCart()"
    >
      🛒 Cart (<span id="cartCount">0</span>)
    </button>

    <button
      id="loginButton"
      class="login-btn"
      onclick="loginAdmin()"
    >
      🔐 Admin Login
    </button>

    <button
      id="logoutButton"
      class="logout-btn"
      onclick="logoutAdmin()"
      style="display:none;"
    >
      Logout
    </button>

  </div>

</header>


<main>

  <div
    id="loginMessage"
    class="login-message"
  >
    You are logged in as administrator.
  </div>


  <div
    id="statusMessage"
    class="status-message"
  ></div>


  <!-- ADMIN PANEL -->

  <div id="adminPanel">

    <h2>⚙️ Admin Panel</h2>

    <input
      type="text"
      id="productName"
      placeholder="Product name"
    >

    <select id="productCategory">

      <option value="Bakery">
        Bakery
      </option>

      <option value="Bread">
        Bread
      </option>

      <option value="Buns">
        Buns
      </option>

      <option value="Cakes">
        Cakes
      </option>

      <option value="Snacks">
        Snacks
      </option>

      <option value="Desserts">
        Desserts
      </option>

    </select>

    <input
      type="number"
      id="productPrice"
      placeholder="Price"
      step="0.01"
    >

    <textarea
      id="productDescription"
      placeholder="Description"
    ></textarea>

    <input
      type="file"
      id="productImage"
      accept="image/*"
    >

    <button
      class="admin-save-btn"
      onclick="saveProduct()"
    >
      💾 Save Product
    </button>

    <button
      class="admin-cancel-btn"
      onclick="cancelEdit()"
    >
      Cancel
    </button>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="text"
      id="search"
      placeholder="🔎 Search bakery items..."
      oninput="displayProducts()"
    >

  </div>


  <!-- CATEGORY FILTER -->

  <div class="category-buttons">

    <button
      class="active"
      onclick="filterCategory('All', this)"
    >
      All
    </button>

    <button
      onclick="filterCategory('Bakery', this)"
    >
      Bakery
    </button>

    <button
      onclick="filterCategory('Bread', this)"
    >
      Bread
    </button>

    <button
      onclick="filterCategory('Buns', this)"
    >
      Buns
    </button>

    <button
      onclick="filterCategory('Cakes', this)"
    >
      Cakes
    </button>

    <button
      onclick="filterCategory('Snacks', this)"
    >
      Snacks
    </button>

    <button
      onclick="filterCategory('Desserts', this)"
    >
      Desserts
    </button>

  </div>


  <!-- PRODUCTS -->

  <div
    id="products"
    class="products-grid"
  >
  </div>


  <!-- CART -->

  <section
    id="cartSection"
    class="cart-section"
  >

    <h2>🛒 Your Cart</h2>

    <div id="cartItems">
    </div>

    <div id="cartSummary">
    </div>

  </section>

</main>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://kyrkcfytfptlwzyemwlw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dYpkOE1xtLwYnITLYKgXTg_K6Bb0fF6";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     SETTINGS
  ========================= */

  const ADMIN_USER_ID =
    "fa350331-2645-4ca3-b16a-11819fe7d5f5";

  const WHATSAPP_NUMBER =
    "9607359040";


  /* =========================
     VARIABLES
  ========================= */

  let products = [];

  let cart =
    JSON.parse(
      localStorage.getItem("kanbuloCart") || "[]"
    );

  let selectedCategory = "All";

  let isAdmin = false;

  let editingProductId = null;


  /* =========================
     ESCAPE HTML
  ========================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     CART STORAGE
  ========================= */

  function loadCart() {

    try {

      cart =
        JSON.parse(
          localStorage.getItem("kanbuloCart") || "[]"
        );

      if (!Array.isArray(cart)) {
        cart = [];
      }

    } catch (error) {

      cart = [];

    }

    renderCart();

  }


  function saveCart() {

    localStorage.setItem(
      "kanbuloCart",
      JSON.stringify(cart)
    );

  }


  /* =========================
     ADD TO CART
  ========================= */

  function addToCart(productId) {

    const product =
      products.find(
        p =>
          String(p.id) ===
          String(productId)
      );

    if (!product) {

      alert(
        "Product could not be found."
      );

      return;
    }


    if (product.available === false) {

      alert(
        "Sorry, this product is currently unavailable."
      );

      return;
    }


    const existing =
      cart.find(
        item =>
          String(item.id) ===
          String(productId)
      );


    if (existing) {

      existing.quantity += 1;

    } else {

      cart.push({

        id: product.id,

        name: product.name,

        price: Number(product.price),

        quantity: 1

      });

    }


    saveCart();

    renderCart();

    scrollToCart();

  }


  /* =========================
     CHANGE QUANTITY
  ========================= */

  function changeCartQuantity(
    productId,
    change
  ) {

    const item =
      cart.find(
        item =>
          String(item.id) ===
          String(productId)
      );


    if (!item) return;


    item.quantity =
      Number(item.quantity) +
      Number(change);


    if (item.quantity <= 0) {

      cart =
        cart.filter(
          item =>
            String(item.id) !==
            String(productId)
        );

    }


    saveCart();

    renderCart();

  }


  /* =========================
     REMOVE CART ITEM
  ========================= */

  function removeFromCart(productId) {

    cart =
      cart.filter(
        item =>
          String(item.id) !==
          String(productId)
      );


    saveCart();

    renderCart();

  }


  /* =========================
     CART TOTAL
  ========================= */

  function getCartTotal() {

    return cart.reduce(
      (total, item) => {

        const price =
          Number(item.price) || 0;

        const quantity =
          Number(item.quantity) || 0;

        return total +
          (price * quantity);

      },
      0
    );

  }


  /* =========================
     RENDER CART
  ========================= */

  function renderCart() {

    const cartItems =
      document.getElementById(
        "cartItems"
      );

    const cartSummary =
      document.getElementById(
        "cartSummary"
      );

    const cartCount =
      document.getElementById(
        "cartCount"
      );


    const totalQuantity =
      cart.reduce(
        (total, item) =>
          total +
          Number(item.quantity || 0),
        0
      );


    cartCount.textContent =
      totalQuantity;


    if (cart.length === 0) {

      cartItems.innerHTML = `
        <div class="empty-cart">
          🛒 Your cart is empty.
          <br>
          Add some delicious bakery items!
        </div>
      `;

      cartSummary.innerHTML = "";

      return;
    }


    cartItems.innerHTML =
      cart.map(item => {

        const price =
          Number(item.price) || 0;

        const quantity =
          Number(item.quantity) || 0;

        const subtotal =
          price * quantity;


        return `

          <div class="cart-item">

            <div class="cart-item-name">
              ${escapeHtml(item.name)}
            </div>

            <div class="cart-item-price">
              MVR ${price.toFixed(2)} each
            </div>

            <div class="cart-controls">

              <button
                class="quantity-btn"
                onclick="changeCartQuantity(${item.id}, -1)"
              >
                −
              </button>

              <span class="quantity-number">
                ${quantity}
              </span>

              <button
                class="quantity-btn"
                onclick="changeCartQuantity(${item.id}, 1)"
              >
                +
              </button>

              <button
                class="remove-btn"
                onclick="removeFromCart(${item.id})"
              >
                Remove
              </button>

            </div>

            <div class="cart-subtotal">
              Subtotal:
              MVR ${subtotal.toFixed(2)}
            </div>

          </div>

        `;

      }).join("");


    const total =
      getCartTotal();


    cartSummary.innerHTML = `

      <div class="cart-total">
        TOTAL:
        MVR ${total.toFixed(2)}
      </div>

      <button
        class="whatsapp-btn"
        onclick="orderOnWhatsApp()"
      >
        📱 Order on WhatsApp
      </button>

    `;

  }


  /* =========================
     SCROLL TO CART
  ========================= */

  function scrollToCart() {

    document
      .getElementById("cartSection")
      .scrollIntoView({
        behavior: "smooth"
      });

  }


  /* =========================
     WHATSAPP ORDER
  ========================= */

  function orderOnWhatsApp() {

    if (cart.length === 0) {

      alert(
        "Your cart is empty."
      );

      return;
    }


    let message =
      "🥖 *KANBULO BAKERY ORDER*\n\n";


    cart.forEach(item => {

      const price =
        Number(item.price) || 0;

      const quantity =
        Number(item.quantity) || 0;

      const itemTotal =
        price * quantity;


      message +=
        "• " +
        item.name +
        " × " +
        quantity +
        " = MVR " +
        itemTotal.toFixed(2) +
        "\n";

    });


    const total =
      getCartTotal();


    message +=
      "\n💰 *TOTAL: MVR " +
      total.toFixed(2) +
      "*";


    message +=
      "\n\n📍 Please send your delivery/pickup details and contact information.";


    const whatsappUrl =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(message);


    window.open(
      whatsappUrl,
      "_blank"
    );

  }


  /* =========================
     LOAD PRODUCTS
  ========================= */

  async function loadProducts() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("id", {
          ascending: true
        });


    if (error) {

      console.error(error);

      showStatus(
        "Could not load products.",
        true
      );

      return;
    }


    products =
      data || [];


    displayProducts();

  }


  /* =========================
     DISPLAY PRODUCTS
  ========================= */

  function displayProducts() {

    const container =
      document.getElementById(
        "products"
      );


    const searchValue =
      document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filtered =
      products.filter(product => {

        const matchesCategory =
          selectedCategory === "All" ||
          product.category ===
          selectedCategory;


        const matchesSearch =
          String(product.name || "")
            .toLowerCase()
            .includes(searchValue) ||

          String(product.category || "")
            .toLowerCase()
            .includes(searchValue);


        return (
          matchesCategory &&
          matchesSearch
        );

      });


    if (filtered.length === 0) {

      container.innerHTML = `
        <p>
          No products found.
        </p>
      `;

      return;
    }


    container.innerHTML =
      filtered.map(product => {

        const availability =
          product.available !== false;


        const imageUrl =
          product.image_url ||
          "";


        let imageHtml = "";

        if (imageUrl) {

          imageHtml = `
            <img
              class="product-image"
              src="${escapeHtml(imageUrl)}"
              alt="${escapeHtml(product.name)}"
            >
          `;

        } else {

          imageHtml = `
            <div
              class="product-image"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:50px;
              "
            >
              🥖
            </div>
          `;

        }


        /*
          IMPORTANT:

          Add to Cart is now shown
          even for the admin.

          Previously this had:
          availability && !isAdmin

          We changed it to:
          availability
        */

        let cartButton = "";


        if (availability) {

          cartButton = `

            <button
              class="add-cart-btn"
              onclick="addToCart(${product.id})"
            >
              🛍️ Add to Cart
            </button>

          `;

        }


        let adminButtons = "";


        if (isAdmin) {

          adminButtons = `

            <div class="card-buttons">

              <button
                class="edit-btn"
                onclick="editProduct(${product.id})"
              >
                ✏️ Edit
              </button>

              <button
                class="hide-btn"
                onclick="toggleAvailability(
                  ${product.id},
                  ${availability}
                )"
              >
                ${
                  availability
                    ? "🙈 Hide"
                    : "👁️ Show"
                }
              </button>

              <button
                class="delete-btn"
                onclick="deleteProduct(${product.id})"
              >
                🗑️ Delete
              </button>

            </div>

          `;

        }


        return `

          <div class="product-card">

            ${imageHtml}

            <div class="product-info">

              <div class="product-name">
                ${escapeHtml(product.name)}
              </div>

              <div class="product-category">
                ${escapeHtml(product.category || "")}
              </div>

              <div class="product-price">
                MVR ${
                  Number(product.price || 0)
                    .toFixed(2)
                }
              </div>

              <div class="${
                availability
                  ? "available"
                  : "unavailable"
              }">

                ${
                  availability
                    ? "Available"
                    : "Currently unavailable"
                }

              </div>

            </div>

            ${cartButton}

            ${adminButtons}

          </div>

        `;

      }).join("");

  }


  /* =========================
     CATEGORY FILTER
  ========================= */

  function filterCategory(
    category,
    button
  ) {

    selectedCategory =
      category;


    document
      .querySelectorAll(
        ".category-buttons button"
      )
      .forEach(btn => {

        btn.classList.remove(
          "active"
        );

      });


    button.classList.add(
      "active"
    );


    displayProducts();

  }


  /* =========================
     SHOW STATUS
  ========================= */

  function showStatus(
    message,
    error = false
  ) {

    const box =
      document.getElementById(
        "statusMessage"
      );


    box.textContent =
      message;

    box.style.display =
      "block";

    box.style.background =
      error
        ? "#f8d7da"
        : "#d4edda";


    setTimeout(() => {

      box.style.display =
        "none";

    }, 4000);

  }


  /* =========================
     ADMIN LOGIN
  ========================= */

  async function loginAdmin() {

    const email =
      prompt(
        "Enter admin email:"
      );


    if (!email) return;


    const password =
      prompt(
        "Enter admin password:"
      );


    if (!password) return;


    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


    if (error) {

      alert(
        "Login failed: " +
        error.message
      );

      return;
    }


    if (
      !data.user ||
      data.user.id !==
      ADMIN_USER_ID
    ) {

      await supabaseClient.auth.signOut();

      alert(
        "This account is not authorized as administrator."
      );

      return;
    }


    await setAdminUI();

    alert(
      "Admin login successful!"
    );

  }


  /* =========================
     LOGOUT
  ========================= */

  async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    isAdmin = false;

    editingProductId = null;

    setAdminUI();

    displayProducts();

  }


  /* =========================
     ADMIN UI
  ========================= */

  async function setAdminUI() {

    const {
      data
    } =
      await supabaseClient.auth.getUser();


    const user =
      data?.user || null;


    isAdmin =
      !!user &&
      user.id ===
      ADMIN_USER_ID;


    const adminPanel =
      document.getElementById(
        "adminPanel"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    if (isAdmin) {

      adminPanel.style.display =
        "block";

      loginButton.style.display =
        "none";

      logoutButton.style.display =
        "inline-block";

      loginMessage.style.display =
        "block";

    } else {

      adminPanel.style.display =
        "none";

      loginButton.style.display =
        "inline-block";

      logoutButton.style.display =
        "none";

      loginMessage.style.display =
        "none";

    }


    displayProducts();

  }


  /* =========================
     SAVE PRODUCT
  ========================= */

  async function saveProduct() {

    if (!isAdmin) {

      alert(
        "Admin access required."
      );

      return;
    }


    const name =
      document
        .getElementById(
          "productName"
        )
        .value
        .trim();


    const category =
      document
        .getElementById(
          "productCategory"
        )
        .value;


    const price =
      Number(
        document
          .getElementById(
            "productPrice"
          )
          .value
      );


    const description =
      document
        .getElementById(
          "productDescription"
        )
        .value
        .trim();


    const imageFile =
      document
        .getElementById(
          "productImage"
        )
        .files[0];


    if (!name) {

      alert(
        "Please enter product name."
      );

      return;
    }


    if (
      isNaN(price) ||
      price < 0
    ) {

      alert(
        "Please enter a valid price."
      );

      return;
    }


    let imageUrl = null;


    /* IMAGE UPLOAD */

    if (imageFile) {

      const fileName =
        Date.now() +
        "_" +
        imageFile.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("product-images")
          .upload(
            fileName,
            imageFile,
            {
              upsert: false
            }
          );


      if (uploadError) {

        alert(
          "Image upload failed: " +
          uploadError.message
        );

        return;
      }


      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("product-images")
          .getPublicUrl(
            fileName
          );


      imageUrl =
        publicData.publicUrl;

    }


    /* EDIT EXISTING */

    if (editingProductId) {

      const updateData = {

        name: name,

        category: category,

        price: price,

        description:
          description

      };


      if (imageUrl) {

        updateData.image_url =
          imageUrl;

      }


      const {
        error
      } =
        await supabaseClient
          .from("products")
          .update(updateData)
          .eq(
            "id",
            editingProductId
          );


      if (error) {

        alert(
          "Update failed: " +
          error.message
        );

        return;
      }


      alert(
        "Product updated successfully!"
      );


    } else {

      /* ADD NEW PRODUCT */

      const {
        error
      } =
        await supabaseClient
          .from("products")
          .insert([{

            name: name,

            category: category,

            price: price,

            description:
              description,

            image_url:
              imageUrl,

            available: true

          }]);


      if (error) {

        alert(
          "Product could not be added: " +
          error.message
        );

        return;
      }


      alert(
        "Product added successfully!"
      );

    }


    cancelEdit();

    await loadProducts();

  }


  /* =========================
     EDIT PRODUCT
  ========================= */

  function editProduct(productId) {

    if (!isAdmin) {

      alert(
        "Admin access required."
      );

      return;
    }


    const product =
      products.find(
        p =>
          String(p.id) ===
          String(productId)
      );


    if (!product) return;


    editingProductId =
      product.id;


    document
      .getElementById(
        "productName"
      )
      .value =
      product.name || "";


    document
      .getElementById(
        "productCategory"
      )
      .value =
      product.category || "Bakery";


    document
      .getElementById(
        "productPrice"
      )
      .value =
      product.price || "";


    document
      .getElementById(
        "productDescription"
      )
      .value =
      product.description || "";


    document
      .getElementById(
        "productImage"
      )
      .value = "";


    document
      .getElementById(
        "adminPanel"
      )
      .scrollIntoView({
        behavior: "smooth"
      });

  }


  /* =========================
     CANCEL EDIT
  ========================= */

  function cancelEdit() {

    editingProductId =
      null;


    document
      .getElementById(
        "productName"
      )
      .value = "";


    document
      .getElementById(
        "productCategory"
      )
      .value =
      "Bakery";


    document
      .getElementById(
        "productPrice"
      )
      .value = "";


    document
      .getElementById(
        "productDescription"
      )
      .value = "";


    document
      .getElementById(
        "productImage"
      )
      .value = "";

  }


  /* =========================
     TOGGLE AVAILABILITY
  ========================= */

  async function toggleAvailability(
    productId,
    currentStatus
  ) {

    if (!isAdmin) {

      alert(
        "Admin access required."
      );

      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .update({
          available:
            !currentStatus
        })
        .eq(
          "id",
          productId
        );


    if (error) {

      alert(
        "Could not update availability: " +
        error.message
      );

      return;
    }


    await loadProducts();

  }


  /* =========================
     DELETE PRODUCT
  ========================= */

  async function deleteProduct(
    productId
  ) {

    if (!isAdmin) {

      alert(
        "Admin access required."
      );

      return;
    }


    const product =
      products.find(
        p =>
          String(p.id) ===
          String(productId)
      );


    if (!product) return;


    const confirmed =
      confirm(
        "Delete " +
        product.name +
        "?"
      );


    if (!confirmed) return;


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .delete()
        .eq(
          "id",
          productId
        );


    if (error) {

      alert(
        "Delete failed: " +
        error.message
      );

      return;
    }


    alert(
      "Product deleted."
    );


    /* Remove from cart too */

    cart =
      cart.filter(
        item =>
          String(item.id) !==
          String(productId)
      );


    saveCart();

    renderCart();

    await loadProducts();

  }


  /* =========================
     INITIALIZE
  ========================= */

  async function initialize() {

    loadCart();

    await loadProducts();

    await setAdminUI();

  }


  initialize();


  /* =========================
     AUTH STATE
  ========================= */

  supabaseClient.auth.onAuthStateChange(
    async () => {

      setTimeout(
        () => {
          setAdminUI();
        },
        0
      );

    }
  );


  /* =========================
     PWA SERVICE WORKER
  ========================= */

  if (
    "serviceWorker" in
    navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register("./sw.js")
          .catch(error => {

            console.log(
              "Service worker registration failed:",
              error
            );

          });

      }
    );

  }

</script>
