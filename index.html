<body>

<header>
  <h1>🥖 Kanbulo Bakery</h1>
  <p>Freshly baked with love ❤️</p>
</header>

<div class="container">

  <!-- ADMIN LOGIN -->
  <div id="adminLoginBox" class="admin-login">
    <h2>🔐 Admin Login</h2>

    <input
      type="email"
      id="adminEmail"
      placeholder="Admin email"
      autocomplete="username"
    >

    <input
      type="password"
      id="adminPassword"
      placeholder="Admin password"
      autocomplete="current-password"
    >

    <button class="login-btn" onclick="loginAdmin()">
      Login as Admin
    </button>

    <div id="loginMessage" class="message"></div>
  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="admin-panel hidden">

    <h2>⚙️ Bakery Admin</h2>

    <div class="admin-status">
      ✅ You are logged in as the bakery administrator.
    </div>

    <button class="logout-btn" onclick="logoutAdmin()">
      Logout
    </button>

    <hr>

    <h3 id="formTitle">➕ Add Product</h3>

    <input
      type="text"
      id="productName"
      placeholder="Product name"
    >

    <input
      type="number"
      id="productPrice"
      placeholder="Price (MVR)"
      step="0.01"
    >

    <select id="productCategory">
      <option value="Bakery">Bakery</option>
      <option value="Cakes">Cakes</option>
      <option value="Sweets">Sweets</option>
      <option value="Other">Other</option>
    </select>

    <textarea
      id="productDescription"
      placeholder="Product description"
    ></textarea>

    <input
      type="file"
      id="productImage"
      accept="image/*"
      onchange="previewImage(event)"
    >

    <img id="imagePreview" class="preview">

    <br>

    <button class="save-btn" onclick="saveProduct()">
      💾 Save Product
    </button>

    <button
      class="cancel-btn"
      onclick="cancelEdit()"
      id="cancelButton"
      style="display:none;"
    >
      Cancel
    </button>

    <div id="message" class="message"></div>

  </div>


  <!-- SEARCH -->
  <div class="search-box">
    <input
      type="text"
      id="search"
      placeholder="🔍 Search products..."
      oninput="filterProducts()"
    >
  </div>


  <!-- CATEGORIES -->
  <div class="categories">

    <button
      class="category-btn active"
      onclick="selectCategory('All', this)"
    >
      All
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('Bakery', this)"
    >
      Bakery
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('Cakes', this)"
    >
      Cakes
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('Sweets', this)"
    >
      Sweets
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('Other', this)"
    >
      Other
    </button>

  </div>


  <!-- PRODUCTS -->
  <div id="products"></div>

</div>


<footer>
  © 2026 Kanbulo Bakery
</footer>


<script>

  /* ================================
     SUPABASE
  ================================= */

  const SUPABASE_URL =
    "https://kyrkcfytfptlwzyemwlw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dYpkOE1xtLwYnITLYKgXTg_K6Bb0fF6";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     ADMIN SETTINGS
  ================================= */

  const ADMIN_USER_ID =
    "fa350331-2645-4ca3-b16a-11819fe7d5f5";

  let isAdmin = false;
  let currentUser = null;

  let products = [];
  let editingId = null;
  let selectedCategory = "All";
  let selectedImageFile = null;


  /* ================================
     AUTH INITIALIZATION
  ================================= */

  async function initAuth() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    setAdminUI(session ? session.user : null);


    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        setAdminUI(
          session ? session.user : null
        );

      }
    );
  }


  /* ================================
     ADMIN UI
  ================================= */

  function setAdminUI(user) {

    currentUser = user;

    isAdmin =
      !!user &&
      user.id === ADMIN_USER_ID;

    const loginBox =
      document.getElementById("adminLoginBox");

    const adminPanel =
      document.getElementById("adminPanel");


    if (isAdmin) {

      loginBox.classList.add("hidden");
      adminPanel.classList.remove("hidden");

    } else {

      loginBox.classList.remove("hidden");
      adminPanel.classList.add("hidden");

    }


    displayProducts();
  }


  /* ================================
     ADMIN LOGIN
  ================================= */

  async function loginAdmin() {

    const email =
      document.getElementById("adminEmail").value.trim();

    const password =
      document.getElementById("adminPassword").value;

    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      message.style.color = "red";
      message.textContent =
        "Please enter your email and password.";

      return;
    }


    message.style.color = "#8b4513";
    message.textContent = "Logging in...";


    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({

      email: email,
      password: password

    });


    if (error) {

      message.style.color = "red";
      message.textContent =
        "Login failed: " + error.message;

      return;
    }


    if (
      !data.user ||
      data.user.id !== ADMIN_USER_ID
    ) {

      await supabaseClient.auth.signOut();

      message.style.color = "red";
      message.textContent =
        "This account is not authorized as bakery admin.";

      return;
    }


    document.getElementById("adminPassword").value = "";

    message.style.color = "green";
    message.textContent =
      "Login successful!";

  }


  /* ================================
     LOGOUT
  ================================= */

  async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    cancelEdit();

  }


  /* ================================
     LOAD PRODUCTS
  ================================= */

  async function loadProducts() {

    const {
      data,
      error
    } = await supabaseClient
      .from("products")
      .select("*")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      document.getElementById("products").innerHTML =
        "<p>Unable to load products.</p>";

      return;
    }


    products = data || [];

    displayProducts();

  }


  /* ================================
     DISPLAY PRODUCTS
  ================================= */

  function displayProducts() {

    const container =
      document.getElementById("products");

    const search =
      document
        .getElementById("search")
        .value
        .toLowerCase();


    let filtered =
      products.filter(product => {

        const matchesSearch =
          product.name
            .toLowerCase()
            .includes(search);


        const matchesCategory =
          selectedCategory === "All" ||
          product.category === selectedCategory;


        return (
          matchesSearch &&
          matchesCategory
        );

      });


    if (filtered.length === 0) {

      container.innerHTML =
        "<p>No products found.</p>";

      return;
    }


    container.innerHTML =
      filtered.map(product => {

        const image =
          product.image_url ||
          "https://via.placeholder.com/500x350?text=Kanbulo+Bakery";


        const availability =
          product.available !== false;


        let adminButtons = "";


        /*
          IMPORTANT:
          Customers do NOT see these buttons.
        */

        if (isAdmin) {

          adminButtons = `
            <div class="card-buttons">

              <button
                class="edit-btn"
                onclick="editProduct(${product.id})"
              >
                ✏️ Edit
              </button>

              <button
                class="hide-btn"
                onclick="toggleAvailability(
                  ${product.id},
                  ${availability}
                )"
              >
                ${availability ? "🙈 Hide" : "👁️ Show"}
              </button>

              <button
                class="delete-btn"
                onclick="deleteProduct(${product.id})"
              >
                🗑️ Delete
              </button>

            </div>
          `;

        }


        return `
          <div class="product-card">

            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(product.name)}"
            >

            <div class="product-content">

              <span class="category-label">
                ${escapeHtml(product.category || "Other")}
              </span>

              <h3>
                ${escapeHtml(product.name)}
              </h3>

              <div class="price">
                MVR ${Number(product.price).toFixed(2)}
              </div>

              <div class="description">
                ${escapeHtml(product.description || "")}
              </div>

              <div class="availability ${
                availability
                  ? "available"
                  : "unavailable"
              }">

                ${
                  availability
                    ? "✅ Available"
                    : "❌ Currently unavailable"
                }

              </div>

              ${adminButtons}

            </div>

          </div>
        `;

      }).join("");

  }


  /* ================================
     SEARCH
  ================================= */

  function filterProducts() {

    displayProducts();

  }


  /* ================================
     CATEGORY
  ================================= */

  function selectCategory(category, button) {

    selectedCategory = category;


    document
      .querySelectorAll(".category-btn")
      .forEach(btn => {

        btn.classList.remove("active");

      });


    button.classList.add("active");

    displayProducts();

  }


  /* ================================
     IMAGE PREVIEW
  ================================= */

  function previewImage(event) {

    selectedImageFile =
      event.target.files[0] || null;


    const preview =
      document.getElementById("imagePreview");


    if (selectedImageFile) {

      preview.src =
        URL.createObjectURL(
          selectedImageFile
        );

      preview.style.display =
        "block";

    } else {

      preview.src = "";
      preview.style.display =
        "none";

    }

  }


  /* ================================
     SAVE PRODUCT
  ================================= */

  async function saveProduct() {

    if (!isAdmin) {

      alert("Admin login required.");

      return;
    }


    const name =
      document
        .getElementById("productName")
        .value
        .trim();


    const price =
      document
        .getElementById("productPrice")
        .value;


    const category =
      document
        .getElementById("productCategory")
        .value;


    const description =
      document
        .getElementById("productDescription")
        .value
        .trim();


    const message =
      document.getElementById("message");


    if (!name || !price) {

      message.style.color = "red";
      message.textContent =
        "Please enter product name and price.";

      return;
    }


    message.style.color = "#8b4513";
    message.textContent =
      "Saving product...";


    let imageUrl = null;


    /*
      Upload new image if selected.
    */

    if (selectedImageFile) {

      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "-" +
        selectedImageFile.name;


      const {
        error: uploadError
      } =
        await supabaseClient.storage
          .from("product-images")
          .upload(
            fileName,
            selectedImageFile
          );


      if (uploadError) {

        console.error(uploadError);

        message.style.color = "red";
        message.textContent =
          "Image upload failed: " +
          uploadError.message;

        return;
      }


      const {
        data: publicUrlData
      } =
        supabaseClient.storage
          .from("product-images")
          .getPublicUrl(fileName);


      imageUrl =
        publicUrlData.publicUrl;

    }


    /*
      EDIT EXISTING PRODUCT
    */

    if (editingId !== null) {

      const updateData = {

        name: name,
        price: Number(price),
        category: category,
        description: description

      };


      if (imageUrl) {

        updateData.image_url =
          imageUrl;

      }


      const {
        error
      } =
        await supabaseClient
          .from("products")
          .update(updateData)
          .eq("id", editingId);


      if (error) {

        console.error(error);

        message.style.color = "red";
        message.textContent =
          "Update failed: " +
          error.message;

        return;
      }


      message.style.color = "green";
      message.textContent =
        "Product updated successfully!";

    }


    /*
      ADD NEW PRODUCT
    */

    else {

      const {
        error
      } =
        await supabaseClient
          .from("products")
          .insert({

            name: name,
            price: Number(price),
            category: category || "Other",
            description: description,
            image_url: imageUrl,
            available: true

          });


      if (error) {

        console.error(error);

        message.style.color = "red";
        message.textContent =
          "Product could not be added: " +
          error.message;

        return;
      }


      message.style.color = "green";
      message.textContent =
        "Product added successfully!";

    }


    resetForm();

    await loadProducts();

  }


  /* ================================
     EDIT PRODUCT
  ================================= */

  function editProduct(id) {

    if (!isAdmin) {

      alert("Admin login required.");

      return;
    }


    const product =
      products.find(p => p.id === id);


    if (!product) return;


    editingId = id;


    document.getElementById("formTitle")
      .textContent =
      "✏️ Edit Product";


    document.getElementById("productName")
      .value =
      product.name || "";


    document.getElementById("productPrice")
      .value =
      product.price || "";


    document.getElementById("productCategory")
      .value =
      product.category || "Other";


    document.getElementById("productDescription")
      .value =
      product.description || "";


    document.getElementById("cancelButton")
      .style.display =
      "inline-block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* ================================
     RESET FORM
  ================================= */

  function resetForm() {

    editingId = null;
    selectedImageFile = null;


    document.getElementById("productName")
      .value = "";


    document.getElementById("productPrice")
      .value = "";


    document.getElementById("productCategory")
      .value = "Bakery";


    document.getElementById("productDescription")
      .value = "";


    document.getElementById("productImage")
      .value = "";


    const preview =
      document.getElementById("imagePreview");


    preview.src = "";
    preview.style.display = "none";


    document.getElementById("formTitle")
      .textContent =
      "➕ Add Product";


    document.getElementById("cancelButton")
      .style.display =
      "none";

  }


  /* ================================
     CANCEL EDIT
  ================================= */

  function cancelEdit() {

    resetForm();

    document.getElementById("message")
      .textContent = "";

  }


  /* ================================
     HIDE / SHOW PRODUCT
  ================================= */

  async function toggleAvailability(
    id,
    currentAvailability
  ) {

    if (!isAdmin) {

      alert("Admin login required.");

      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .update({
          available: !currentAvailability
        })
        .eq("id", id);


    if (error) {

      alert(
        "Could not change availability: " +
        error.message
      );

      return;
    }


    await loadProducts();

  }


  /* ================================
     DELETE PRODUCT
  ================================= */

  async function deleteProduct(id) {

    if (!isAdmin) {

      alert("Admin login required.");

      return;
    }


    const confirmed =
      confirm(
        "Are you sure you want to delete this product?"
      );


    if (!confirmed) return;


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Could not delete product: " +
        error.message
      );

      return;
    }


    await loadProducts();

  }


  /* ================================
     HTML SECURITY
  ================================= */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ================================
     START WEBSITE
  ================================= */

  initAuth();

  loadProducts();

</script>


<script>

  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register("./sw.js")
          .catch(error => {

            console.log(
              "Service worker registration failed:",
              error
            );

          });

      }
    );

  }

</script>

</body>
</html>
