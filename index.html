
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#8b4513">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kanbulo Bakery</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8f3;
      color: #333;
    }

    header {
      background: #8b4513;
      color: white;
      padding: 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    .header-buttons {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-btn {
      background: white;
      color: #8b4513;
    }

    .admin-btn {
      background: #5d2d0b;
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .search-box {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .category-btn {
      background: white;
      border: 1px solid #ddd;
      white-space: nowrap;
    }

    .category-btn.active {
      background: #8b4513;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .product-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      padding-bottom: 15px;
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 14px;
    }

    .product-name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .product-category {
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 18px;
      font-weight: bold;
      color: #8b4513;
      margin-bottom: 8px;
    }

    .available {
      color: green;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .unavailable {
      color: red;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .add-cart-btn {
      width: 100%;
      background: #8b4513;
      color: white;
    }

    .admin-actions {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }

    .admin-actions button {
      flex: 1;
      font-size: 12px;
      padding: 8px;
    }

    .edit-btn {
      background: #ddd;
    }

    .hide-btn {
      background: #f0ad4e;
      color: white;
    }

    .delete-btn {
      background: #d9534f;
      color: white;
    }

    .cart-section {
      margin-top: 30px;
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: bold;
    }

    .cart-item-price {
      color: #777;
      font-size: 14px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-controls button {
      width: 32px;
      height: 32px;
      padding: 0;
      background: #eee;
    }

    .remove-btn {
      background: #d9534f !important;
      color: white;
      width: auto !important;
      padding: 5px 8px !important;
    }

    .cart-total {
      text-align: right;
      font-size: 22px;
      font-weight: bold;
      color: #8b4513;
      margin-top: 15px;
    }

    .order-details {
      margin-top: 25px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .order-details h3 {
      margin-top: 0;
      color: #8b4513;
    }

    .order-details input,
    .order-details select,
    .order-details textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    .whatsapp-btn {
      width: 100%;
      background: #25d366;
      color: white;
      font-size: 16px;
      margin-top: 5px;
    }

    .admin-panel {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .admin-panel input,
    .admin-panel select,
    .admin-panel textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .save-btn {
      background: #8b4513;
      color: white;
      width: 100%;
    }

    .login-box {
      display: none;
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .login-btn {
      background: #8b4513;
      color: white;
      width: 100%;
    }

    .logout-btn {
      background: #d9534f;
      color: white;
    }

    .empty-cart {
      text-align: center;
      color: #777;
      padding: 15px;
    }

    @media (max-width: 600px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product-image {
        height: 140px;
      }

      .product-info {
        padding: 10px;
      }

      .product-name {
        font-size: 16px;
      }

      .product-price {
        font-size: 16px;
      }

      .cart-item {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🥖 Kanbulo Bakery</h1>

  <div class="header-buttons">
    <button class="cart-btn" onclick="scrollToCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>

    <button class="admin-btn" onclick="showLogin()">
      🔐 Admin
    </button>

    <button
      id="logoutButton"
      class="logout-btn"
      style="display:none;"
      onclick="logoutAdmin()">
      Logout
    </button>
  </div>
</header>


<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="login-box">

    <h3>Admin Login</h3>

    <input
      type="email"
      id="loginEmail"
      placeholder="Email">

    <input
      type="password"
      id="loginPassword"
      placeholder="Password">

    <button
      class="login-btn"
      onclick="loginAdmin()">
      Login
    </button>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="admin-panel">

    <h2 id="formTitle">Add Product</h2>

    <input
      type="text"
      id="productName"
      placeholder="Product name">

    <select id="productCategory">
      <option value="Bakery">Bakery</option>
      <option value="Bread">Bread</option>
      <option value="Buns">Buns</option>
      <option value="Cakes">Cakes</option>
      <option value="Snacks">Snacks</option>
      <option value="Desserts">Desserts</option>
    </select>

    <input
      type="number"
      id="productPrice"
      placeholder="Price"
      step="0.01">

    <textarea
      id="productDescription"
      placeholder="Description"
      rows="3"></textarea>

    <input
      type="file"
      id="productImage"
      accept="image/*">

    <button
      class="save-btn"
      onclick="saveProduct()">
      Save Product
    </button>

    <button
      id="cancelEditButton"
      style="display:none; margin-top:10px; width:100%;"
      onclick="cancelEdit()">
      Cancel Edit
    </button>

  </div>


  <!-- SEARCH -->
  <input
    type="text"
    id="searchInput"
    class="search-box"
    placeholder="🔍 Search bakery items..."
    oninput="renderProducts()">


  <!-- CATEGORIES -->
  <div class="categories">

    <button
      class="category-btn active"
      onclick="setCategory('All', this)">
      All
    </button>

    <button
      class="category-btn"
      onclick="setCategory('Bakery', this)">
      Bakery
    </button>

    <button
      class="category-btn"
      onclick="setCategory('Bread', this)">
      Bread
    </button>

    <button
      class="category-btn"
      onclick="setCategory('Buns', this)">
      Buns
    </button>

    <button
      class="category-btn"
      onclick="setCategory('Cakes', this)">
      Cakes
    </button>

    <button
      class="category-btn"
      onclick="setCategory('Snacks', this)">
      Snacks
    </button>

    <button
      class="category-btn"
      onclick="setCategory('Desserts', this)">
      Desserts
    </button>

  </div>


  <!-- PRODUCTS -->
  <div
    id="products"
    class="products">
  </div>


  <!-- CART -->
  <div
    id="cartSection"
    class="cart-section">

    <h2>🛒 Your Cart</h2>

    <div id="cartItems"></div>

    <div
      id="cartSummary"
      style="display:none;">

      <div
        class="cart-total">
        Total: MVR
        <span id="cartTotal">0.00</span>
      </div>


      <!-- CUSTOMER DETAILS -->
      <div class="order-details">

        <h3>📋 Order Details</h3>

        <input
          type="text"
          id="customerName"
          placeholder="Your name">

        <input
          type="tel"
          id="customerPhone"
          placeholder="Phone number">

        <select
          id="orderType"
          onchange="toggleAddress()">

          <option value="Delivery">
            🛵 Delivery
          </option>

          <option value="Pickup">
            🏪 Pickup
          </option>

        </select>

        <textarea
          id="customerAddress"
          placeholder="Delivery address / location"
          rows="3"></textarea>

        <textarea
          id="orderNotes"
          placeholder="Extra notes (optional)"
          rows="2"></textarea>

        <button
          class="whatsapp-btn"
          onclick="orderOnWhatsApp()">
          📱 Order on WhatsApp
        </button>

      </div>

    </div>

  </div>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://kyrkcfytfptlwzyemwlw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dYpkOE1xtLwYnITLYKgXTg_K6Bb0fF6";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     SETTINGS
  ========================= */

  const ADMIN_USER_ID =
    "fa350331-2645-4ca3-b16a-11819fe7d5f5";

  const WHATSAPP_NUMBER =
    "9607359040";


  /* =========================
     VARIABLES
  ========================= */

  let products = [];

  let cart =
    JSON.parse(
      localStorage.getItem("kanbuloCart") || "[]"
    );

  let selectedCategory = "All";

  let user = null;

  let isAdmin = false;

  let editingProductId = null;


  /* =========================
     LOAD PRODUCTS
  ========================= */

  async function loadProducts() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      console.error(error);

      alert(
        "Could not load products."
      );

      return;
    }

    products = data || [];

    renderProducts();

    renderCart();
  }


  /* =========================
     AUTH
  ========================= */

  async function checkUser() {

    const {
      data
    } =
      await supabaseClient
        .auth
        .getUser();

    user =
      data?.user || null;

    isAdmin =
      !!user &&
      user.id === ADMIN_USER_ID;

    updateAdminUI();
  }


  function updateAdminUI() {

    const panel =
      document.getElementById(
        "adminPanel"
      );

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );

    if (isAdmin) {

      panel.style.display =
        "block";

      logoutButton.style.display =
        "inline-block";

    } else {

      panel.style.display =
        "none";

      logoutButton.style.display =
        "none";
    }

    renderProducts();
  }


  function showLogin() {

    if (isAdmin) {

      document.getElementById(
        "adminPanel"
      ).style.display =
        "block";

      return;
    }

    const box =
      document.getElementById(
        "loginBox"
      );

    box.style.display =
      box.style.display === "block"
        ? "none"
        : "block";
  }


  async function loginAdmin() {

    const email =
      document.getElementById(
        "loginEmail"
      ).value.trim();

    const password =
      document.getElementById(
        "loginPassword"
      ).value;

    if (!email || !password) {

      alert(
        "Please enter email and password."
      );

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      alert(
        error.message
      );

      return;
    }

    user =
      data.user;

    isAdmin =
      user.id === ADMIN_USER_ID;

    if (!isAdmin) {

      await supabaseClient.auth.signOut();

      user = null;
      isAdmin = false;

      alert(
        "This account is not an admin."
      );

      return;
    }

    document.getElementById(
      "loginBox"
    ).style.display =
      "none";

    updateAdminUI();

    alert(
      "Admin login successful."
    );
  }


  async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    user = null;

    isAdmin = false;

    updateAdminUI();
  }


  /* =========================
     CATEGORY
  ========================= */

  function setCategory(
    category,
    button
  ) {

    selectedCategory =
      category;

    document
      .querySelectorAll(
        ".category-btn"
      )
      .forEach(btn => {
        btn.classList.remove(
          "active"
        );
      });

    button.classList.add(
      "active"
    );

    renderProducts();
  }


  /* =========================
     PRODUCTS
  ========================= */

  function renderProducts() {

    const container =
      document.getElementById(
        "products"
      );

    const search =
      document.getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();

    let filtered =
      products.filter(product => {

        const matchesCategory =
          selectedCategory === "All" ||
          product.category ===
          selectedCategory;

        const matchesSearch =
          !search ||
          product.name
            .toLowerCase()
            .includes(search) ||
          (product.category || "")
            .toLowerCase()
            .includes(search);

        return (
          matchesCategory &&
          matchesSearch
        );
      });


    if (filtered.length === 0) {

      container.innerHTML =
        "<p>No products found.</p>";

      return;
    }


    container.innerHTML =
      filtered
        .map(product => {

          const availability =
            product.available !== false;

          const image =
            product.image_url ||
            "https://via.placeholder.com/500x350?text=Kanbulo+Bakery";

          return `
            <div class="product-card">

              <img
                class="product-image"
                src="${image}"
                alt="${escapeHtml(product.name)}"
                onerror="this.src='https://via.placeholder.com/500x350?text=Kanbulo+Bakery'">

              <div class="product-info">

                <div class="product-name">
                  ${escapeHtml(product.name)}
                </div>

                <div class="product-category">
                  ${escapeHtml(product.category || "")}
                </div>

                <div class="product-price">
                  MVR ${Number(product.price || 0).toFixed(2)}
                </div>

                ${
                  availability
                    ? `
                      <div class="available">
                        ✓ Available
                      </div>
                    `
                    : `
                      <div class="unavailable">
                        ✕ Currently unavailable
                      </div>
                    `
                }


                ${
                  availability
                    ? `
                      <button
                        class="add-cart-btn"
                        onclick="addToCart('${product.id}')">
                        🛒 Add to Cart
                      </button>
                    `
                    : ""
                }


                ${
                  isAdmin
                    ? `
                      <div class="admin-actions">

                        <button
                          class="edit-btn"
                          onclick="editProduct('${product.id}')">
                          Edit
                        </button>

                        <button
                          class="hide-btn"
                          onclick="toggleAvailability('${product.id}', ${availability})">
                          ${availability ? "Hide" : "Show"}
                        </button>

                        <button
                          class="delete-btn"
                          onclick="deleteProduct('${product.id}')">
                          Delete
                        </button>

                      </div>
                    `
                    : ""
                }

              </div>

            </div>
          `;
        })
        .join("");
  }


  /* =========================
     ADD TO CART
  ========================= */

  function addToCart(productId) {

    const product =
      products.find(
        p =>
          String(p.id) ===
          String(productId)
      );

    if (!product) {

      alert(
        "Product could not be found."
      );

      return;
    }

    if (product.available === false) {

      alert(
        "Sorry, this product is currently unavailable."
      );

      return;
    }


    const existing =
      cart.find(
        item =>
          String(item.id) ===
          String(productId)
      );


    if (existing) {

      existing.quantity += 1;

    } else {

      cart.push({

        id: product.id,

        name: product.name,

        price:
          Number(product.price),

        quantity: 1

      });

    }


    saveCart();

    renderCart();

    scrollToCart();
  }


  /* =========================
     CART QUANTITY
  ========================= */

  function changeCartQuantity(
    productId,
    change
  ) {

    const item =
      cart.find(
        item =>
          String(item.id) ===
          String(productId)
      );

    if (!item) return;


    item.quantity =
      Number(item.quantity) +
      Number(change);


    if (item.quantity <= 0) {

      cart =
        cart.filter(
          item =>
            String(item.id) !==
            String(productId)
        );
    }


    saveCart();

    renderCart();
  }


  /* =========================
     REMOVE CART ITEM
  ========================= */

  function removeFromCart(
    productId
  ) {

    cart =
      cart.filter(
        item =>
          String(item.id) !==
          String(productId)
      );

    saveCart();

    renderCart();
  }


  /* =========================
     SAVE CART
  ========================= */

  function saveCart() {

    localStorage.setItem(
      "kanbuloCart",
      JSON.stringify(cart)
    );
  }


  /* =========================
     CART TOTAL
  ========================= */

  function getCartTotal() {

    return cart.reduce(
      (total, item) => {

        const price =
          Number(item.price) || 0;

        const quantity =
          Number(item.quantity) || 0;

        return total +
          (price * quantity);

      },
      0
    );
  }


  /* =========================
     RENDER CART
  ========================= */

  function renderCart() {

    const cartItems =
      document.getElementById(
        "cartItems"
      );

    const cartSummary =
      document.getElementById(
        "cartSummary"
      );

    const cartCount =
      document.getElementById(
        "cartCount"
      );

    const cartTotal =
      document.getElementById(
        "cartTotal"
      );


    const totalQuantity =
      cart.reduce(
        (total, item) =>
          total +
          Number(item.quantity || 0),
        0
      );


    cartCount.textContent =
      totalQuantity;


    if (cart.length === 0) {

      cartItems.innerHTML =
        `
          <div class="empty-cart">
            Your cart is empty 🛒
          </div>
        `;

      cartSummary.style.display =
        "none";

      return;
    }


    cartSummary.style.display =
      "block";


    cartItems.innerHTML =
      cart
        .map(item => {

          const price =
            Number(item.price) || 0;

          const quantity =
            Number(item.quantity) || 0;

          const itemTotal =
            price * quantity;


          return `
            <div class="cart-item">

              <div class="cart-item-info">

                <div class="cart-item-name">
                  ${escapeHtml(item.name)}
                </div>

                <div class="cart-item-price">
                  MVR ${price.toFixed(2)}
                  each
                  <br>
                  MVR ${itemTotal.toFixed(2)}
                </div>

              </div>


              <div class="quantity-controls">

                <button
                  onclick="changeCartQuantity('${item.id}', -1)">
                  −
                </button>

                <strong>
                  ${quantity}
                </strong>

                <button
                  onclick="changeCartQuantity('${item.id}', 1)">
                  +
                </button>

                <button
                  class="remove-btn"
                  onclick="removeFromCart('${item.id}')">
                  Remove
                </button>

              </div>

            </div>
          `;
        })
        .join("");


    cartTotal.textContent =
      getCartTotal().toFixed(2);
  }


  /* =========================
     SCROLL TO CART
  ========================= */

  function scrollToCart() {

    document
      .getElementById(
        "cartSection"
      )
      .scrollIntoView({
        behavior: "smooth"
      });
  }


  /* =========================
     DELIVERY / PICKUP
  ========================= */

  function toggleAddress() {

    const orderType =
      document.getElementById(
        "orderType"
      ).value;

    const address =
      document.getElementById(
        "customerAddress"
      );


    if (orderType === "Pickup") {

      address.placeholder =
        "Pickup note / preferred time (optional)";

    } else {

      address.placeholder =
        "Delivery address / location";
    }
  }


  /* =========================
     WHATSAPP ORDER
  ========================= */

  function orderOnWhatsApp() {

    if (cart.length === 0) {

      alert(
        "Your cart is empty."
      );

      return;
    }


    const name =
      document
        .getElementById(
          "customerName"
        )
        .value
        .trim();


    const phone =
      document
        .getElementById(
          "customerPhone"
        )
        .value
        .trim();


    const orderType =
      document
        .getElementById(
          "orderType"
        )
        .value;


    const address =
      document
        .getElementById(
          "customerAddress"
        )
        .value
        .trim();


    const notes =
      document
        .getElementById(
          "orderNotes"
        )
        .value
        .trim();


    if (!name) {

      alert(
        "Please enter your name."
      );

      return;
    }


    if (!phone) {

      alert(
        "Please enter your phone number."
      );

      return;
    }


    if (
      orderType === "Delivery" &&
      !address
    ) {

      alert(
        "Please enter your delivery address."
      );

      return;
    }


    let message =
      "🥖 *KANBULO BAKERY ORDER*\n\n";


    message +=
      "👤 *Name:* " +
      name +
      "\n";


    message +=
      "📱 *Phone:* " +
      phone +
      "\n";


    message +=
      "📦 *Order type:* " +
      orderType +
      "\n";


    if (address) {

      message +=
        "📍 *Location:* " +
        address +
        "\n";
    }


    message +=
      "\n*ORDER ITEMS:*\n";


    cart.forEach(item => {

      const price =
        Number(item.price) || 0;

      const quantity =
        Number(item.quantity) || 0;

      const itemTotal =
        price * quantity;


      message +=
        "• " +
        item.name +
        " × " +
        quantity +
        " = MVR " +
        itemTotal.toFixed(2) +
        "\n";

    });


    const total =
      getCartTotal();


    message +=
      "\n💰 *TOTAL: MVR " +
      total.toFixed(2) +
      "*\n";


    if (notes) {

      message +=
        "\n📝 *Notes:* " +
        notes +
        "\n";
    }


    message +=
      "\n🙏 Thank you for ordering from Kanbulo Bakery!";


    const whatsappUrl =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(
        message
      );


    window.open(
      whatsappUrl,
      "_blank"
    );
  }


  /* =========================
     ADD / EDIT PRODUCT
  ========================= */

  async function saveProduct() {

    if (!isAdmin) {

      alert(
        "Admin access required."
      );

      return;
    }


    const name =
      document
        .getElementById(
          "productName"
        )
        .value
        .trim();


    const category =
      document
        .getElementById(
          "productCategory"
        )
        .value;


    const price =
      Number(
        document
          .getElementById(
            "productPrice"
          )
          .value
      );


    const description =
      document
        .getElementById(
          "productDescription"
        )
        .value
        .trim();


    const imageFile =
      document
        .getElementById(
          "productImage"
        )
        .files[0];


    if (!name) {

      alert(
        "Please enter a product name."
      );

      return;
    }


    if (
      isNaN(price) ||
      price < 0
    ) {

      alert(
        "Please enter a valid price."
      );

      return;
    }


    let imageUrl = null;


    if (editingProductId) {

      const existing =
        products.find(
          p =>
            String(p.id) ===
            String(editingProductId)
        );

      imageUrl =
        existing?.image_url || null;
    }


    if (imageFile) {

      const fileName =
        Date.now() +
        "_" +
        imageFile.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("product-images")
          .upload(
            fileName,
            imageFile,
            {
              upsert: false
            }
          );


      if (uploadError) {

        console.error(
          uploadError
        );

        alert(
          "Image upload failed: " +
          uploadError.message
        );

        return;
      }


      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("product-images")
          .getPublicUrl(
            fileName
          );


      imageUrl =
        publicData.publicUrl;
    }


    const productData = {

      name,

      category,

      price,

      description,

      available: true,

      ...(imageUrl
        ? {
            image_url:
              imageUrl
          }
        : {})
    };


    if (editingProductId) {

      const {
        error
      } =
        await supabaseClient
          .from("products")
          .update(
            productData
          )
          .eq(
            "id",
            editingProductId
          );


      if (error) {

        alert(
          error.message
        );

        return;
      }


      alert(
        "Product updated successfully."
      );

    } else {

      const {
        error
      } =
        await supabaseClient
          .from("products")
          .insert(
            productData
          );


      if (error) {

        alert(
          error.message
        );

        return;
      }


      alert(
        "Product added successfully."
      );
    }


    cancelEdit();

    await loadProducts();
  }


  /* =========================
     EDIT PRODUCT
  ========================= */

  function editProduct(productId) {

    if (!isAdmin) return;


    const product =
      products.find(
        p =>
          String(p.id) ===
          String(productId)
      );


    if (!product) return;


    editingProductId =
      product.id;


    document.getElementById(
      "formTitle"
    ).textContent =
      "Edit Product";


    document.getElementById(
      "productName"
    ).value =
      product.name || "";


    document.getElementById(
      "productCategory"
    ).value =
      product.category || "Bakery";


    document.getElementById(
      "productPrice"
    ).value =
      product.price || "";


    document.getElementById(
      "productDescription"
    ).value =
      product.description || "";


    document.getElementById(
      "cancelEditButton"
    ).style.display =
      "block";


    document.getElementById(
      "adminPanel"
    ).scrollIntoView({
      behavior: "smooth"
    });
  }


  /* =========================
     CANCEL EDIT
  ========================= */

  function cancelEdit() {

    editingProductId =
      null;


    document.getElementById(
      "formTitle"
    ).textContent =
      "Add Product";


    document.getElementById(
      "productName"
    ).value =
      "";


    document.getElementById(
      "productPrice"
    ).value =
      "";


    document.getElementById(
      "productDescription"
    ).value =
      "";


    document.getElementById(
      "productImage"
    ).value =
      "";


    document.getElementById(
      "cancelEditButton"
    ).style.display =
      "none";
  }


  /* =========================
     HIDE / SHOW PRODUCT
  ========================= */

  async function toggleAvailability(
    productId,
    currentlyAvailable
  ) {

    if (!isAdmin) {

      alert(
        "Admin access required."
      );

      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .update({
          available:
            !currentlyAvailable
        })
        .eq(
          "id",
          productId
        );


    if (error) {

      alert(
        error.message
      );

      return;
    }


    await loadProducts();
  }


  /* =========================
     DELETE PRODUCT
  ========================= */

  async function deleteProduct(
    productId
  ) {

    if (!isAdmin) {

      alert(
        "Admin access required."
      );

      return;
    }


    const product =
      products.find(
        p =>
          String(p.id) ===
          String(productId)
      );


    if (!product) return;


    const confirmDelete =
      confirm(
        "Delete " +
        product.name +
        "?"
      );


    if (!confirmDelete) {
      return;
    }


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .delete()
        .eq(
          "id",
          productId
        );


    if (error) {

      alert(
        error.message
      );

      return;
    }


    removeFromCart(
      productId
    );


    await loadProducts();


    alert(
      "Product deleted."
    );
  }


  /* =========================
     HTML SAFETY
  ========================= */

  function escapeHtml(
    value
  ) {

    return String(
      value || ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  /* =========================
     START
  ========================= */

  async function startApp() {

    await checkUser();

    await loadProducts();

    toggleAddress();
  }


  startApp();


  /* =========================
     AUTH STATE CHANGES
  ========================= */

  supabaseClient
    .auth
    .onAuthStateChange(
      async (
        event,
        session
      ) => {

        user =
          session?.user || null;

        isAdmin =
          !!user &&
          user.id ===
          ADMIN_USER_ID;

        updateAdminUI();
      }
    );


  /* =========================
     SERVICE WORKER
  ========================= */

  if (
    "serviceWorker" in navigator
  ) {

    navigator
      .serviceWorker
      .register("./sw.js")
      .catch(
        error =>
          console.log(
            "Service worker error:",
            error
          )
      );
  }

</script>
