<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b4513">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kanbulo Bakery</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff8ef;
      color: #3b2416;
    }

    header {
      background: linear-gradient(135deg, #7b351b, #b95b2b);
      color: white;
      padding: 28px 18px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 6px;
    }

    header p {
      opacity: .9;
      font-size: 15px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }

    .admin-box {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(80,40,10,.08);
    }

    .admin-box h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #a94d25;
    }

    .preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin: 5px 0 12px;
      display: none;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 11px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .primary {
      background: #8d3f20;
      color: white;
    }

    .primary:hover {
      background: #6f2e16;
    }

    .secondary {
      background: #eee;
      color: #333;
    }

    .danger {
      background: #d9534f;
      color: white;
    }

    .success {
      background: #4b8b3b;
      color: white;
    }

    .top-tools {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .search {
      flex: 1;
      min-width: 200px;
      margin: 0;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    .category-btn {
      white-space: nowrap;
      background: white;
      border: 1px solid #e2d3c5;
      color: #63331d;
      padding: 10px 16px;
      border-radius: 25px;
    }

    .category-btn.active {
      background: #8d3f20;
      color: white;
      border-color: #8d3f20;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(70,35,10,.09);
      transition: transform .2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .product-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #f1dfcc;
    }

    .card-content {
      padding: 15px;
    }

    .card h3 {
      font-size: 19px;
      margin-bottom: 5px;
    }

    .category-label {
      display: inline-block;
      background: #f5e2d2;
      color: #85401f;
      padding: 5px 9px;
      border-radius: 15px;
      font-size: 12px;
      margin-bottom: 9px;
    }

    .description {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #9a451f;
      margin-bottom: 10px;
    }

    .availability {
      font-size: 13px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .available {
      color: #438336;
    }

    .unavailable {
      color: #c43c35;
    }

    .card-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card-buttons button {
      flex: 1;
      min-width: 70px;
      padding: 9px 8px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #777;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #8b7567;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      .container {
        padding: 12px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product-image {
        height: 145px;
      }

      .card-content {
        padding: 11px;
      }

      .card h3 {
        font-size: 16px;
      }

      .price {
        font-size: 17px;
      }

      .description {
        font-size: 12px;
      }

      .card-buttons button {
        font-size: 11px;
        padding: 8px 5px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🥖 Kanbulo Bakery</h1>
  <p>Freshly baked with love ❤️</p>
</header>

<div class="container">

  <!-- ADMIN -->
  <div class="admin-box">
    <h2 id="formTitle">➕ Add New Product</h2>

    <input id="productName" type="text" placeholder="Product name">

    <input id="productPrice" type="number" step="0.01" placeholder="Price in MVR">

    <select id="productCategory">
      <option value="">Select category</option>
      <option value="Bakery">🥖 Bakery</option>
      <option value="Cakes">🍰 Cakes</option>
      <option value="Sweets">🍬 Sweets</option>
      <option value="Other">🍽️ Other</option>
    </select>

    <textarea id="productDescription"
      placeholder="Description (optional)"></textarea>

    <input id="productImage"
      type="file"
      accept="image/*"
      onchange="previewImage(event)">

    <img id="imagePreview" class="preview">

    <div class="buttons">
      <button class="primary" onclick="saveProduct()">
        💾 Save Product
      </button>

      <button id="cancelBtn"
        class="secondary"
        onclick="cancelEdit()"
        style="display:none;">
        Cancel
      </button>
    </div>

    <p id="message" style="margin-top:10px;"></p>
  </div>


  <!-- SEARCH -->
  <div class="top-tools">
    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 Search bakery items..."
      oninput="filterProducts()">
  </div>


  <!-- CATEGORIES -->
  <div class="categories">

    <button class="category-btn active"
      onclick="selectCategory('All', this)">
      All
    </button>

    <button class="category-btn"
      onclick="selectCategory('Bakery', this)">
      🥖 Bakery
    </button>

    <button class="category-btn"
      onclick="selectCategory('Cakes', this)">
      🍰 Cakes
    </button>

    <button class="category-btn"
      onclick="selectCategory('Sweets', this)">
      🍬 Sweets
    </button>

    <button class="category-btn"
      onclick="selectCategory('Other', this)">
      🍽️ Other
    </button>

  </div>


  <h2 class="section-title">Our Products</h2>

  <div id="products" class="products">
    <div class="loading">Loading products... 🥖</div>
  </div>

</div>

<footer>
  © 2026 Kanbulo Bakery
</footer>


<script>

  // ==============================
  // SUPABASE
  // ==============================

  const SUPABASE_URL =
    "https://kyrkcfytfptlwzyemwlw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dYpkOE1xtLwYnITLYKgXTg_K6Bb0fF6";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // VARIABLES
  // ==============================

  let products = [];

  let editingId = null;

  let selectedCategory = "All";

  let selectedImageFile = null;


  // ==============================
  // LOAD PRODUCTS
  // ==============================

  async function loadProducts() {

    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      console.error(error);

      document.getElementById("products").innerHTML =
        `<div class="empty">
          ❌ Could not load products.
        </div>`;

      return;
    }

    products = data || [];

    displayProducts();
  }


  // ==============================
  // DISPLAY PRODUCTS
  // ==============================

  function displayProducts() {

    const container =
      document.getElementById("products");

    const search =
      document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    let filtered = products.filter(product => {

      const matchesSearch =
        product.name.toLowerCase().includes(search) ||
        (product.description || "")
          .toLowerCase()
          .includes(search);

      const matchesCategory =
        selectedCategory === "All" ||
        product.category === selectedCategory;

      return matchesSearch && matchesCategory;
    });


    if (filtered.length === 0) {

      container.innerHTML =
        `<div class="empty">
          <h3>🥐 No products found</h3>
          <p>Try another search or category.</p>
        </div>`;

      return;
    }


    container.innerHTML =
      filtered.map(product => {

        const image =
          product.image_url ||
          "https://via.placeholder.com/500x350?text=Kanbulo+Bakery";


        const price =
          Number(product.price || 0)
            .toFixed(2);


        return `
          <div class="card">

            <img
              class="product-image"
              src="${escapeHtml(image)}"
              alt="${escapeHtml(product.name)}"
              onerror="this.src='https://via.placeholder.com/500x350?text=Kanbulo+Bakery'"
            >

            <div class="card-content">

              <span class="category-label">
                ${escapeHtml(product.category || "Other")}
              </span>

              <h3>
                ${escapeHtml(product.name)}
              </h3>

              <div class="price">
                MVR ${price}
              </div>

              ${
                product.description
                ? `<div class="description">
                    ${escapeHtml(product.description)}
                   </div>`
                : ""
              }

              <div class="availability ${
                product.available
                  ? "available"
                  : "unavailable"
              }">

                ${
                  product.available
                  ? "✓ Available"
                  : "✕ Unavailable"
                }

              </div>

              <div class="card-buttons">

                <button
                  class="primary"
                  onclick="editProduct(${product.id})">
                  ✏️ Edit
                </button>

                <button
                  class="${
                    product.available
                    ? "secondary"
                    : "success"
                  }"
                  onclick="toggleAvailability(
                    ${product.id},
                    ${product.available}
                  )">

                  ${
                    product.available
                    ? "Hide"
                    : "Show"
                  }

                </button>

                <button
                  class="danger"
                  onclick="deleteProduct(${product.id})">
                  🗑️
                </button>

              </div>

            </div>

          </div>
        `;

      }).join("");
  }


  // ==============================
  // SEARCH
  // ==============================

  function filterProducts() {
    displayProducts();
  }


  // ==============================
  // CATEGORY
  // ==============================

  function selectCategory(category, button) {

    selectedCategory = category;

    document
      .querySelectorAll(".category-btn")
      .forEach(btn =>
        btn.classList.remove("active")
      );

    button.classList.add("active");

    displayProducts();
  }


  // ==============================
  // IMAGE PREVIEW
  // ==============================

  function previewImage(event) {

    const file =
      event.target.files[0];

    if (!file) return;

    selectedImageFile = file;

    const preview =
      document.getElementById("imagePreview");

    preview.src =
      URL.createObjectURL(file);

    preview.style.display = "block";
  }


  // ==============================
  // SAVE PRODUCT
  // ==============================

  async function saveProduct() {

    const name =
      document.getElementById("productName")
        .value
        .trim();

    const price =
      document.getElementById("productPrice")
        .value;

    const category =
      document.getElementById("productCategory")
        .value;

    const description =
      document.getElementById("productDescription")
        .value
        .trim();


    if (!name) {
      alert("Please enter a product name.");
      return;
    }

    if (price === "") {
      alert("Please enter a price.");
      return;
    }


    const message =
      document.getElementById("message");

    message.innerText =
      "Saving...";


    let imageUrl = null;


    // ==============================
    // UPLOAD IMAGE
    // ==============================

    if (selectedImageFile) {

      const extension =
        selectedImageFile.name
          .split(".")
          .pop();

      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        extension;


      const { error: uploadError } =
        await supabaseClient.storage
          .from("product-images")
          .upload(
            fileName,
            selectedImageFile
          );


      if (uploadError) {

        console.error(uploadError);

        message.innerText =
          "❌ Image upload failed.";

        return;
      }


      const { data } =
        supabaseClient.storage
          .from("product-images")
          .getPublicUrl(fileName);


      imageUrl =
        data.publicUrl;
    }


    // ==============================
    // EDIT
    // ==============================

    if (editingId) {

      const updateData = {

        name: name,

        price: Number(price),

        category: category,

        description: description

      };


      if (imageUrl) {
        updateData.image_url = imageUrl;
      }


      const { error } =
        await supabaseClient
          .from("products")
          .update(updateData)
          .eq("id", editingId);


      if (error) {

        console.error(error);

        message.innerText =
          "❌ Could not update product.";

        return;
      }


      message.innerText =
        "✅ Product updated!";

    }


    // ==============================
    // NEW PRODUCT
    // ==============================

    else {

      const { error } =
        await supabaseClient
          .from("products")
          .insert({

            name: name,

            price: Number(price),

            category:
              category || "Other",

            description:
              description,

            image_url:
              imageUrl,

            available: true

          });


      if (error) {

        console.error(error);

        message.innerText =
          "❌ Could not save product.";

        return;
      }


      message.innerText =
        "✅ Product added!";
    }


    resetForm();

    await loadProducts();
  }


  // ==============================
  // EDIT PRODUCT
  // ==============================

  function editProduct(id) {

    const product =
      products.find(p => p.id === id);

    if (!product) return;


    editingId = id;

    document.getElementById("formTitle")
      .innerText =
      "✏️ Edit Product";


    document.getElementById("productName")
      .value =
      product.name;


    document.getElementById("productPrice")
      .value =
      product.price;


    document.getElementById("productCategory")
      .value =
      product.category || "Other";


    document.getElementById("productDescription")
      .value =
      product.description || "";


    document.getElementById("cancelBtn")
      .style.display =
      "inline-block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  // ==============================
  // CANCEL EDIT
  // ==============================

  function cancelEdit() {

    resetForm();

  }


  // ==============================
  // RESET FORM
  // ==============================

  function resetForm() {

    editingId = null;

    selectedImageFile = null;

    document.getElementById("formTitle")
      .innerText =
      "➕ Add New Product";


    document.getElementById("productName")
      .value = "";


    document.getElementById("productPrice")
      .value = "";


    document.getElementById("productCategory")
      .value = "";


    document.getElementById("productDescription")
      .value = "";


    document.getElementById("productImage")
      .value = "";


    document.getElementById("imagePreview")
      .style.display =
      "none";


    document.getElementById("cancelBtn")
      .style.display =
      "none";
  }


  // ==============================
  // AVAILABILITY
  // ==============================

  async function toggleAvailability(id, current) {

    const { error } =
      await supabaseClient
        .from("products")
        .update({
          available: !current
        })
        .eq("id", id);


    if (error) {

      alert("Could not change availability.");

      console.error(error);

      return;
    }


    loadProducts();
  }


  // ==============================
  // DELETE
  // ==============================

  async function deleteProduct(id) {

    const product =
      products.find(p => p.id === id);

    if (!product) return;


    const confirmDelete =
      confirm(
        `Delete "${product.name}"?`
      );


    if (!confirmDelete) return;


    const { error } =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (error) {

      alert("Could not delete product.");

      console.error(error);

      return;
    }


    loadProducts();
  }


  // ==============================
  // SECURITY
  // ==============================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // ==============================
  // START
  // ==============================

  loadProducts();

</script>

</body> <script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>
</html>
