  /* ================================

  const SUPABASE_URL =

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     ADMIN SETTINGS
  ================================= */

  const ADMIN_USER_ID =
    "fa350331-2645-4ca3-b16a-11819fe7d5f5";

  const WHATSAPP_NUMBER =
    "9607359040";


  let isAdmin = false;
  let currentUser = null;

  let products = [];
  let editingId = null;
  let selectedCategory = "All";
  let selectedImageFile = null;

  let cart = [];


  /* ================================
     AUTH INITIALIZATION
  ================================= */

  async function initAuth() {

    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();

    setAdminUI(
      session ? session.user : null
    );


    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        setAdminUI(
          session ? session.user : null
        );

      }
    );

  }


  /* ================================
     ADMIN UI
  ================================= */

  function setAdminUI(user) {

    currentUser = user;

    isAdmin =
      !!user &&
      user.id === ADMIN_USER_ID;


    const loginBox =
      document.getElementById(
        "adminLoginBox"
      );

    const adminPanel =
      document.getElementById(
        "adminPanel"
      );


    if (isAdmin) {

      loginBox.classList.add(
        "hidden"
      );

      adminPanel.classList.remove(
        "hidden"
      );

    } else {

      loginBox.classList.remove(
        "hidden"
      );

      adminPanel.classList.add(
        "hidden"
      );

    }


    displayProducts();

  }


  /* ================================
     ADMIN LOGIN
  ================================= */

  async function loginAdmin() {

    const email =
      document
        .getElementById("adminEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("adminPassword")
        .value;

    const message =
      document.getElementById(
        "loginMessage"
      );


    if (!email || !password) {

      message.style.color = "red";

      message.textContent =
        "Please enter your email and password.";

      return;

    }


    message.style.color =
      "#8b4513";

    message.textContent =
      "Logging in...";


    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,
          password: password

        });


    if (error) {

      message.style.color =
        "red";

      message.textContent =
        "Login failed: " +
        error.message;

      return;

    }


    if (
      !data.user ||
      data.user.id !== ADMIN_USER_ID
    ) {

      await supabaseClient.auth.signOut();

      message.style.color =
        "red";

      message.textContent =
        "This account is not authorized as bakery admin.";

      return;

    }


    document.getElementById(
      "adminPassword"
    ).value = "";


    message.style.color =
      "green";

    message.textContent =
      "Login successful!";

  }


  /* ================================
     LOGOUT
  ================================= */

  async function logoutAdmin() {

    await supabaseClient.auth.signOut();

    cancelEdit();

  }


  /* ================================
     LOAD PRODUCTS
  ================================= */

  async function loadProducts() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      document.getElementById(
        "products"
      ).innerHTML =
        "<p>Unable to load products.</p>";

      return;

    }


    products =
      data || [];

    displayProducts();

  }


  /* ================================
     DISPLAY PRODUCTS
  ================================= */

  function displayProducts() {

    const container =
      document.getElementById(
        "products"
      );


    const search =
      document
        .getElementById("search")
        .value
        .toLowerCase();


    let filtered =
      products.filter(
        product => {

          const matchesSearch =
            product.name
              .toLowerCase()
              .includes(search);


          const matchesCategory =
            selectedCategory === "All" ||
            product.category ===
              selectedCategory;


          return (
            matchesSearch &&
            matchesCategory
          );

        }
      );


    if (filtered.length === 0) {

      container.innerHTML =
        "<p>No products found.</p>";

      return;

    }


    container.innerHTML =
      filtered
        .map(product => {

          const image =
            product.image_url ||
            "https://via.placeholder.com/500x350?text=Kanbulo+Bakery";


          const availability =
            product.available !== false;


          let adminButtons = "";


          /* ADMIN BUTTONS */

          if (isAdmin) {

            adminButtons = `

              <div class="card-buttons">

                <button
                  class="edit-btn"
                  onclick="editProduct(${product.id})"
                >
                  ✏️ Edit
                </button>

                <button
                  class="hide-btn"
                  onclick="toggleAvailability(
                    ${product.id},
                    ${availability}
                  )"
                >
                  ${
                    availability
                      ? "🙈 Hide"
                      : "👁️ Show"
                  }
                </button>

                <button
                  class="delete-btn"
                  onclick="deleteProduct(${product.id})"
                >
                  🗑️ Delete
                </button>

              </div>

            `;

          }


          /* ADD TO CART */

          let cartButton = "";


          if (
            availability &&
            !isAdmin
          ) {

            cartButton = `

              <button
                class="add-cart-btn"
                onclick="addToCart(${product.id})"
              >
                🛍️ Add to Cart
              </button>

            `;

          }


          return `

            <div class="product-card">

              <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(product.name)}"
              >

              <div class="product-content">

                <span class="category-label">
                  ${escapeHtml(
                    product.category ||
                    "Other"
                  )}
                </span>

                <h3>
                  ${escapeHtml(
                    product.name
                  )}
                </h3>

                <div class="price">
                  MVR
                  ${Number(
                    product.price
                  ).toFixed(2)}
                </div>

                <div class="description">
                  ${escapeHtml(
                    product.description ||
                    ""
                  )}
                </div>

                <div
                  class="availability ${
                    availability
                      ? "available"
                      : "unavailable"
                  }"
                >

                  ${
                    availability
                      ? "✅ Available"
                      : "❌ Currently unavailable"
                  }

                </div>

                ${cartButton}

                ${adminButtons}

              </div>

            </div>

          `;

        })
        .join("");

  }


  /* ================================
     SEARCH
  ================================= */

  function filterProducts() {

    displayProducts();

  }


  /* ================================
     CATEGORY
  ================================= */

  function selectCategory(
    category,
    button
  ) {

    selectedCategory =
      category;


    document
      .querySelectorAll(
        ".category-btn"
      )
      .forEach(btn => {

        btn.classList.remove(
          "active"
        );

      });


    button.classList.add(
      "active"
    );


    displayProducts();

  }


  /* ================================
     CART
  ================================= */

  function loadCart() {

    try {

      const savedCart =
        localStorage.getItem(
          "kanbuloCart"
        );


      if (savedCart) {

        cart =
          JSON.parse(
            savedCart
          );

      }

    } catch (error) {

      console.error(
        "Could not load cart:",
        error
      );

      cart = [];

    }


    renderCart();

  }


  function saveCart() {

    localStorage.setItem(
      "kanbuloCart",
      JSON.stringify(cart)
    );

  }


  function addToCart(
    productId
  ) {

    const product =
      products.find(
        p =>
          String(p.id) ===
          String(productId)
      );


    if (!product) {

      alert(
        "Product could not be found."
      );

      return;

    }


    if (
      product.available === false
    ) {

      alert(
        "Sorry, this product is currently unavailable."
      );

      return;

    }


    const existing =
      cart.find(
        item =>
          String(item.id) ===
          String(productId)
      );


    if (existing) {

      existing.quantity += 1;

    } else {

      cart.push({

        id: product.id,

        name: product.name,

        price:
          Number(product.price),

        quantity: 1

      });

    }


    saveCart();

    renderCart();

    scrollToCart();

  }


  function changeCartQuantity(
    productId,
    change
  ) {

    const item =
      cart.find(
        item =>
          String(item.id) ===
          String(productId)
      );


    if (!item) return;


    item.quantity =
      Number(item.quantity) +
      Number(change);


    if (
      item.quantity <= 0
    ) {

      cart =
        cart.filter(
          item =>
            String(item.id) !==
            String(productId)
        );

    }


    saveCart();

    renderCart();

  }


  function removeFromCart(
    productId
  ) {

    cart =
      cart.filter(
        item =>
          String(item.id) !==
          String(productId)
      );


    saveCart();

    renderCart();

  }


  function getCartTotal() {

    return cart.reduce(
      (
        total,
        item
      ) => {

        const price =
          Number(item.price) || 0;

        const quantity =
          Number(item.quantity) || 0;

        return total +
          (
            price *
            quantity
          );

      },
      0
    );

  }


  function renderCart() {

    const cartItems =
      document.getElementById(
        "cartItems"
      );

    const cartSummary =
      document.getElementById(
        "cartSummary"
      );

    const cartCount =
      document.getElementById(
        "cartCount"
      );


    const total =
      getCartTotal();


    const totalItems =
      cart.reduce(
        (
          sum,
          item
        ) => {

          return sum +
            (
              Number(
                item.quantity
              ) || 0
            );

        },
        0
      );


    cartCount.textContent =
      totalItems;


    if (
      cart.length === 0
    ) {

      cartItems.innerHTML = `

        <div class="cart-empty">

          🛒 Your cart is empty.

          <br>

          Add some delicious bakery items!

        </div>

      `;


      cartSummary.classList.add(
        "hidden"
      );

      return;

    }


    cartSummary.classList.remove(
      "hidden"
    );


    cartItems.innerHTML =
      cart
        .map(item => {

          const price =
            Number(item.price) || 0;

          const quantity =
            Number(item.quantity) || 0;

          const itemTotal =
            price *
            quantity;


          return `

            <div class="cart-item">

              <div class="cart-item-info">

                <div class="cart-item-name">
                  ${escapeHtml(
                    item.name
                  )}
                </div>

                <div class="cart-item-price">

                  MVR
                  ${price.toFixed(2)}
                  each

                  <br>

                  Quantity:
                  ${quantity}

                  <br>

                  Subtotal:
                  MVR
                  ${itemTotal.toFixed(2)}

                </div>

              </div>


              <div class="quantity-controls">

                <button
                  onclick="changeCartQuantity(
                    '${String(item.id)}',
                    -1
                  )"
                >
                  −
                </button>

                <span class="quantity">
                  ${quantity}
                </span>

                <button
                  onclick="changeCartQuantity(
                    '${String(item.id)}',
                    1
                  )"
                >
                  +
                </button>

              </div>


              <button
                class="remove-btn"
                onclick="removeFromCart(
                  '${String(item.id)}'
                )"
              >
                Remove
              </button>

            </div>

          `;

        })
        .join("");


    document.getElementById(
      "cartTotal"
    ).textContent =
      total.toFixed(2);

  }


  function scrollToCart() {

    document
      .getElementById("cartBox")
      .scrollIntoView({

        behavior: "smooth",

        block: "start"

      });

  }


  /* ================================
     WHATSAPP ORDER
  ================================= */

  function orderOnWhatsApp() {

    if (
      cart.length === 0
    ) {

      alert(
        "Your cart is empty."
      );

      return;

    }


    let message =
      "🥖 *KANBULO BAKERY ORDER*\n\n";


    cart.forEach(
      item => {

        const price =
          Number(item.price) || 0;

        const quantity =
          Number(item.quantity) || 0;

        const itemTotal =
          price *
          quantity;


        message +=
          "• " +
          item.name +
          " × " +
          quantity +
          " = MVR " +
          itemTotal.toFixed(2) +
          "\n";

      }
    );


    const total =
      getCartTotal();


    message +=
      "\n💰 *TOTAL: MVR " +
      total.toFixed(2) +
      "*";


    message +=
      "\n\n📍 Please send your delivery/pickup details and contact information.";


    const whatsappUrl =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(
        message
      );


    window.open(
      whatsappUrl,
      "_blank"
    );

  }


  /* ================================
     IMAGE PREVIEW
  ================================= */

  function previewImage(
    event
  ) {

    selectedImageFile =
      event.target.files[0] ||
      null;


    const preview =
      document.getElementById(
        "imagePreview"
      );


    if (
      selectedImageFile
    ) {

      preview.src =
        URL.createObjectURL(
          selectedImageFile
        );

      preview.style.display =
        "block";

    } else {

      preview.src = "";

      preview.style.display =
        "none";

    }

  }


  /* ================================
     SAVE PRODUCT
  ================================= */

  async function saveProduct() {

    if (!isAdmin) {

      alert(
        "Admin login required."
      );

      return;

    }


    const name =
      document
        .getElementById(
          "productName"
        )
        .value
        .trim();


    const price =
      document
        .getElementById(
          "productPrice"
        )
        .value;


    const category =
      document
        .getElementById(
          "productCategory"
        )
        .value;


    const description =
      document
        .getElementById(
          "productDescription"
        )
        .value
        .trim();


    const message =
      document.getElementById(
        "message"
      );


    if (
      !name ||
      !price
    ) {

      message.style.color =
        "red";

      message.textContent =
        "Please enter product name and price.";

      return;

    }


    message.style.color =
      "#8b4513";

    message.textContent =
      "Saving product...";


    let imageUrl = null;


    /* UPLOAD IMAGE */

    if (
      selectedImageFile
    ) {

      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "-" +
        selectedImageFile.name;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("product-images")
          .upload(
            fileName,
            selectedImageFile
          );


      if (uploadError) {

        console.error(
          uploadError
        );

        message.style.color =
          "red";

        message.textContent =
          "Image upload failed: " +
          uploadError.message;

        return;

      }


      const {
        data: publicUrlData
      } =
        supabaseClient
          .storage
          .from("product-images")
          .getPublicUrl(
            fileName
          );


      imageUrl =
        publicUrlData.publicUrl;

    }


    /* EDIT PRODUCT */

    if (
      editingId !== null
    ) {

      const updateData = {

        name: name,

        price:
          Number(price),

        category: category,

        description:
          description

      };


      if (imageUrl) {

        updateData.image_url =
          imageUrl;

      }


      const {
        error
      } =
        await supabaseClient
          .from("products")
          .update(
            updateData
          )
          .eq(
            "id",
            editingId
          );


      if (error) {

        console.error(
          error
        );

        message.style.color =
          "red";

        message.textContent =
          "Update failed: " +
          error.message;

        return;

      }


      message.style.color =
        "green";

      message.textContent =
        "Product updated successfully!";

    }


    /* ADD PRODUCT */

    else {

      const {
        error
      } =
        await supabaseClient
          .from("products")
          .insert({

            name: name,

            price:
              Number(price),

            category:
              category ||
              "Other",

            description:
              description,

            image_url:
              imageUrl,

            available:
              true

          });


      if (error) {

        console.error(
          error
        );

        message.style.color =
          "red";

        message.textContent =
          "Product could not be added: " +
          error.message;

        return;

      }


      message.style.color =
        "green";

      message.textContent =
        "Product added successfully!";

    }


    resetForm();

    await loadProducts();

  }


  /* ================================
     EDIT PRODUCT
  ================================= */

  function editProduct(
    id
  ) {

    if (!isAdmin) {

      alert(
        "Admin login required."
      );

      return;

    }


    const product =
      products.find(
        p =>
          String(p.id) ===
          String(id)
      );


    if (!product) return;


    editingId =
      product.id;


    document.getElementById(
      "formTitle"
    ).textContent =
      "✏️ Edit Product";


    document.getElementById(
      "productName"
    ).value =
      product.name || "";


    document.getElementById(
      "productPrice"
    ).value =
      product.price || "";


    document.getElementById(
      "productCategory"
    ).value =
      product.category ||
      "Other";


    document.getElementById(
      "productDescription"
    ).value =
      product.description ||
      "";


    document.getElementById(
      "cancelButton"
    ).style.display =
      "inline-block";


    window.scrollTo({

      top: 0,

      behavior: "smooth"

    });

  }

     RESET FORM
  ================================= */

  function resetForm() {

    editingId =
      null;

    selectedImageFile =

    ).value = "";

      "productPrice"
    ).value = "";

      "productDescription"
    ).value = "";


    document.getElementById(

     CANCEL EDIT

  function cancelEdit() {

    ).textContent = "";

  }


  /* ================================
     HIDE / SHOW PRODUCT
  ================================= */

  async function toggleAvailability(
    id,
    currentAvailability
  ) {

    if (!isAdmin) {

      alert(
        "Admin login required."
      );

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .update({

          available:
            !currentAvailability

        })
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "Could not change availability: " +
        error.message
      );

      return;

    }


    await loadProducts();

  }


  /* ================================
     DELETE PRODUCT
  ================================= */

  async function deleteProduct(
    id
  ) {

    if (!isAdmin) {

      alert(
        "Admin login required."
      );

      return;

    }


    const confirmed =
      confirm(
        "Are you sure you want to delete this product?"
      );


    if (!confirmed) return;


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      alert(
        "Could not delete product: " +
        error.message
      );

      return;

    }


    /* REMOVE DELETED PRODUCT FROM CART */

    cart =
      cart.filter(
        item =>
          String(item.id) !==
          String(id)
      );


    saveCart();

    renderCart();

    await loadProducts();

  }


  /* ================================
     HTML SECURITY
  ================================= */

  function escapeHtml(
    value
  ) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* ================================
     START WEBSITE
  ================================= */

  loadCart();

  initAuth();

  loadProducts();

</script>
